# Nginx edge for the official public Nevix deployment (issue #152, ADR-0013).
#
# This file is the complete nginx configuration (the compose stack mounts it
# over /etc/nginx/nginx.conf read-only). Invariants it owns:
#
# - Only TLS 1.2/1.3 on 443; the self-signed pair lives in the tls volume.
# - Client-supplied Forwarded / X-Forwarded-* headers are dropped; the only
#   trusted HTTPS marker the Go server can ever see (X-Forwarded-Proto: https)
#   is written here, on the private Docker network, so later slices can enforce
#   secure_transport_required without trusting the public internet.
# - Everything proxies with buffering off: SSE must not be buffered, and
#   uploads, downloads, and Range responses must stream end to end.
# - Rate and connection limits are sized for ~300 users sharing one NAT IP;
#   they are coarse backstops on top of the Go server's own limiters.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    # 300 concurrent SSE streams plus request bursts per NAT profile.
    worker_connections 4096;
}

http {
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;

    # Reference uploads reach 200 MiB (video input contract); downloads are
    # responses and unaffected by this cap.
    client_max_body_size 256m;

    # Backstop limits, intentionally generous per IP because the whole team
    # (~300 users) may sit behind one NAT address. The Go server owns the
    # precise per-account rules; these only blunt floods.
    limit_req_zone $binary_remote_addr zone=nevix_general:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=nevix_auth:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=nevix_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream nevix_server {
        server server:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/tls/server.pem;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2 suites (TLS 1.3 suites are governed separately); ECDSA first
        # to match the provisioned P-256 certificate.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security response headers on every response, including errors.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        # Forwarded-header hygiene: everything client-supplied is discarded
        # and rewritten from the connection fact before reaching the Go
        # server, so spoofed trust markers never cross the edge.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # Streaming end to end: no request buffering (uploads), no response
        # buffering (SSE, downloads, Range), no spooling to temp files, and
        # read timeouts long enough to hold SSE streams between heartbeats.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1h;
        proxy_read_timeout 24h;

        # Tighter per-IP budget on the credential surfaces: login,
        # self-registration, and the instance claim. burst absorbs a team
        # re-login wave behind one NAT without tripping the 429 backstop.
        location = /identity/auth/login {
            limit_req zone=nevix_auth burst=20 nodelay;
            proxy_pass http://nevix_server;
        }

        location = /identity/register {
            limit_req zone=nevix_auth burst=20 nodelay;
            proxy_pass http://nevix_server;
        }

        location = /identity/setup/initialize {
            limit_req zone=nevix_auth burst=20 nodelay;
            proxy_pass http://nevix_server;
        }

        location / {
            limit_req zone=nevix_general burst=400 nodelay;
            limit_conn nevix_conn 2048;
            proxy_pass http://nevix_server;
        }
    }
}
