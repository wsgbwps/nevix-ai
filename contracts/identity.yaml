                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/users/{userID}/role:
    post:
      operationId: changeUserRole
      summary: 调整角色（Admin）
      description: |-
        在 member 与 admin 之间切换账号角色。降级最后一个活跃 Admin（含调用者自己）被拒 409。同一写事务写入 user_role_changed 审计行（metadata 记录 from/to）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - member
      responses:
        "200":
          description: 角色已更新，返回更新后的管理视图。
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - status
                      - must_change_password
                      - last_login_at
                      - created_at
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      status:
                        type: string
                        enum:
                          - active
                          - disabled
                      must_change_password:
                        type: boolean
                      last_login_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                        description: 最近一次登录时刻；null 表示从未登录（删除资格判定）。
                      created_at:
                        type: string
                        format: date-time
        "400":
          description: 请求不合法 —— invalid_request 指缺 role；invalid_role 指值不属于两级角色。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_role
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "404":
          description: 目标用户不存在（或 id 非 UUID）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - user_not_found
        "409":
          description: 目标是最后一个活跃 Admin，降级会使部署失去可管理的管理员。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - last_admin_protected
        "500":
          description: 服务端内部错误，调整未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/users/{userID}:
    delete:
      operationId: deleteUser
      summary: 删除从未登录的账号（Admin）
      description: |-
        删除仅对从未登录过的账号放行（last_login_at 为 null）：清理建错的号，不触碰有历史归属的账号（离职走停用）。审计行刻意不带外键并快照 email，删除后历史仍可读（ADR-0009）。同一事务写入 user_deleted 审计行。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
      responses:
        "200":
          description: 账号已删除。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - deleted
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "404":
          description: 目标用户不存在（或 id 非 UUID）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - user_not_found
        "409":
          description: 目标账号曾登录过，不可删除；离职收权请使用停用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - user_has_logged_in
        "500":
          description: 服务端内部错误，删除未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/admin/join-codes:
    post:
      operationId: createJoinCode
      summary: 签发加入码（Admin）
      description: |-
        签发一枚可复用的注册凭据（ADR-0015 2026-08-23 修订）：码为 8 位 Crockford base32 明文，不随注册消耗，仅吊销失效；全部活跃码被吊销即自注册关闭（不设独立注册开关）。活跃上限 3，由写事务内锁行计数强制，同一事务写入 join_code_created 审计行。member 调用被 RequireAdmin 拒 403。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 128
                  description: 可选备注（如码贴到哪个群）；留空存空串。
      responses:
        "201":
          description: 加入码已签发；扁平形态（id、code、label、created_at），明文码立即可见；created_by 归列表端点。
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - code
                  - label
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                    description: 8 位 Crockford base32 明文码（无 I/L/O/U）。
                    pattern: "^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{8}$"
                  label:
                    type: string
                    description: 签发时选填的备注；未填为空串。
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: 请求体非 JSON 对象，或 label 超过 128 字符。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_label
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "409":
          description: 活跃码已达上限（3）；吊销任一枚后可再签发。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - too_many_active_join_codes
        "500":
          description: 服务端内部错误，签发未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
    get:
      operationId: listJoinCodes
      summary: 活跃加入码列表（Admin）
      description: |-
        返回全部活跃（未吊销）加入码的明文与备注，按创建时间倒序；供 Admin 设置区卡片直接读出分亨。member 调用被 RequireAdmin 拒 403。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 活跃码列表（可能为空）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - join_codes
                properties:
                  join_codes:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinCodeEntry"
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/admin/join-codes/{joinCodeID}:
    delete:
      operationId: revokeJoinCode
      summary: 吊销加入码（Admin）
      description: |-
        吊销一枚活跃码：吊销即失效、不可恢复，行不删除（审计佐证）；同一事务写入 join_code_revoked 审计行。不存在或已吊销的 id（含非 UUID）一律 404，不做区分。member 调用被 RequireAdmin 拒 403。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/joinCodeID"
      responses:
        "200":
          description: 加入码已吊销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - revoked
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "404":
          description: 目标码不存在或已吊销（或 id 非 UUID），两者不区分。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - join_code_not_found
        "500":
          description: 服务端内部错误，吊销未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 审计日志分页（Admin）
      description: |-
        按创建时间倒序分页读取审计日志（ADR-0009 修订：客户端直读取消，读取经 Go API 且 admin-only）。member 调用被 RequireAdmin 拒 403。条目快照写入时刻的 actor/target 显示名；metadata 为任意键值对象。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: 一页审计日志（newest-first）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - page
                  - per_page
                  - total
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - action
                        - actor_user_id
                        - actor_display_name
                        - target_user_id
                        - target_display_name
                        - metadata
                        - created_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        action:
                          type: string
                          description: 审计动作词表（如 session_created、user_created、user_disabled……），由服务端单一写入方校验。
                        actor_user_id:
                          type: string
                          format: uuid
                        actor_display_name:
                          type: string
                          description: 写入时刻的 actor 显示名快照（ADR-0009）。
                        target_user_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        target_display_name:
                          type:
                            - string
                            - "null"
                        metadata:
                          type: object
                          additionalProperties:
                            type: string
                        created_at:
                          type: string
                          format: date-time
                  page:
                    type: integer
                    minimum: 1
                  per_page:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
        "400":
          description: 查询参数不合法（page 非正整数或 per_page 不在 1..100）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_pagination
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色（审计日志仅 Admin 可见，ADR-0015）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
components:
  parameters:
    userID:
      name: userID
      in: path
      required: true
      description: 目标用户 id（UUID）。
      schema:
        type: string
        format: uuid
    joinCodeID:
      name: joinCodeID
      in: path
      required: true
      description: 目标加入码 id（UUID）。
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起，默认 1。
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      required: false
      description: 每页行数，1..100，默认 20。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      $ref: "./openapi.yaml#/components/schemas/Error"
    JoinCodeEntry:
      type: object
      required:
        - id
        - code
        - label
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 8 位 Crockford base32 明文码（无 I/L/O/U）；明文存储是有意决策（ADR-0015）。
          pattern: "^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{8}$"
        label:
          type: string
          description: 签发时选填的备注；未填为空串。
        created_by:
          type: string
          format: uuid
          description: 签发者（Admin）账号 id。
        created_at:
          type: string
          format: date-time
