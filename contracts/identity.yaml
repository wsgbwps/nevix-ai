# Identity Module API contract. The OpenAPI master references each Path Item here.
paths:
  /identity/auth/login:
    post:
      operationId: login
      summary: 登录并签发会话
      description: |-
        用 email 与密码登录：凭据正确且账号 active 时签发一个 opaque session token（30 天滑动过期，多设备并存），同一事务写入 session_created 审计行。token 只在本次响应中出现一次，服务端仅存其 hash。

        email 与密码错误统一回答 401 invalid_credentials（不区分账号是否存在）；账号 disabled 回答 403 account_disabled；同一 email 在窗口内连续失败达到上限后回答 429（数值为信息性，客户端依赖 Retry-After）。must_change_password 为 true 时仍可登录，响应携带该标记以驱动首登改密流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 裸 RFC 5322 地址（如 user@example.com）；display-name 形式被拒绝，服务端统一按小写规范化。
                password:
                  type: string
                  description: 明文密码，经 TLS（或内网 http）传输，服务端只存哈希。
                device_name:
                  type: string
                  maxLength: 128
                  description: 可选的设备名（如 "Elio 的 MacBook"），仅用于会话管理展示。
      responses:
        "200":
          description: 登录成功，返回新会话 token 与账号信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expires_at
                  - user
                properties:
                  token:
                    type: string
                    description: |-
                      opaque session token；客户端持有本体，服务端只存 hash。
                      经 Authorization Bearer 头携带，永不进 URL。
                  expires_at:
                    type: string
                    format: date-time
                    description: 会话过期时刻；每次带凭据使用且剩余不足一半时滑动顺延。
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      must_change_password:
                        type: boolean
                        description: true 表示当前密码是管理员设置的初始密码，客户端应强制改密。
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是含 email 与 password 的 JSON；invalid_email 指 email 不是裸地址；invalid_device_name 指 device_name 超长。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_email
                          - invalid_device_name
        "401":
          description: email 不存在或密码错误（统一防枚举响应）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_credentials
        "403":
          description: 账号已停用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - account_disabled
        "429":
          description: 同一 email 登录失败次数达到进程内限速上限；窗口与上限数值为信息性，客户端以 Retry-After 为准。
          headers:
            Retry-After:
              description: 距允许再次尝试的剩余秒数（整数）。
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - login_rate_limited
        "500":
          description: 服务端内部错误，会话未签发。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/auth/logout:
    post:
      operationId: logout
      summary: 登出当前会话
      description: |-
        吊销当前请求携带的 session（仅此一个）：其他设备的会话不受影响，同一事务写入 session_revoked 审计行。重复登出会因 guard 先拒绝已失效 token 而得到 401。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 当前会话已吊销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - logged_out
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是 JSON 对象（空对象 {} 即可）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "500":
          description: 服务端内部错误，会话吊销未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/auth/change-password:
    post:
      operationId: changePassword
      summary: 修改自己的密码（含首登强制改密）
      description: |-
        验证 current_password 后改密：新密码须满足长度策略（最小 8 字符、最大 72 字节，400 invalid_password）。凭据验证在写事务内对用户行加锁后针对已提交哈希执行，并发改密恰有一个成功（后到者凭据验证失败得 401）。成功时在单一写事务内完成——更新 password_hash、清除 must_change_password 标记、吊销该用户**其他全部**会话（当前请求的会话保留，作为当前会话处置的契约定义）、写入 password_changed 审计行（首登清除初始密码时 metadata.initial 为 true）。

        该命令是 must_change_password 标记用户唯一可用的业务写命令；改密完成后标记清除，全部业务端点恢复可用。current_password 错误回答 401 invalid_credentials（与登录的防枚举语义一致：持有有效会话但凭据验证失败）。本端点不受 403 password_change_required 门禁影响。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  description: 当前密码（首登场景即管理员设置的初始密码）。
                new_password:
                  type: string
                  description: 新密码明文；最小长度 8、最大 72 字节（bcrypt 容量的编码约束，非组成规则；数值为信息性，客户端依据错误码分支）。
      responses:
        "200":
          description: 改密成功；当前会话保留，其他会话已吊销，must_change_password 已清除。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - password_changed
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是含 current_password 与 new_password 的 JSON；invalid_password 指新密码不满足长度策略（过短或超过 72 字节上限）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_password
        "401":
          description: Bearer token 无效（unauthorized），或 current_password 验证失败（invalid_credentials）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
                          - invalid_credentials
        "500":
          description: 服务端内部错误，改密未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/register:
    post:
      operationId: registerWithJoinCode
      summary: 凭加入码自注册并直接进入应用
      description: |-
        拿到 server URL 与活跃加入码的人自选 email、密码、显示名（可选）完成注册（ADR-0015 2026-08-23 修订）：账号落地即 active member，must_change_password=false（密码本人自设，无强制改密），响应携带首个 session token，形态与登录相同。单一写事务：锁定活跃码行校验 → INSERT 用户 → 写 user_self_registered 审计行 → 发 session。码可复用，不随注册消耗。

        码错、已吊销的码与无活跃码（自注册关闭）统一回答 403 invalid_join_code，不做区分（不给枚举面）；注册入口始终可见，是否关闭由提交时的该答案揭示。email 已被占用回答 409 email_taken。同一 email 的失败尝试（码错/邮箱占用）计入与登录共享的进程内限速，达到上限回答 429（数值为信息性，客户端依赖 Retry-After）。加入码为 8 位 Crockford base32，服务端比对前统一 trim 与大写化（大小写不敏感）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - join_code
              properties:
                email:
                  type: string
                  format: email
                  description: 裸 RFC 5322 地址，服务端统一按小写规范化；必须是未被占用的 email。
                password:
                  type: string
                  description: 本人自设的明文密码，经 TLS（或内网 http）传输，服务端只存哈希；最小长度 8。
                join_code:
                  type: string
                  description: Admin 签发的 8 位 Crockford base32 注册码；服务端比对前统一大写化。任意不匹配的字符串（含超长值）统一按 403 invalid_join_code 回答，不设长度上限（受请求体 4KB 上限约束）。
                display_name:
                  type: string
                  maxLength: 128
                  description: 可选显示名；缺省时服务端以 email 本地部分派生。
      responses:
        "201":
          description: 注册成功，返回首个会话 token 与账号信息（形态同登录 200）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expires_at
                  - user
                properties:
                  token:
                    type: string
                    description: opaque session token；客户端持有本体，服务端只存 hash，经 Authorization Bearer 头携带，永不进 URL。
                  expires_at:
                    type: string
                    format: date-time
                    description: 会话过期时刻（30 天滑动过期）。
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - member
                      must_change_password:
                        type: boolean
                        description: 自注册密码本人自设，恒为 false。
        "400":
          description: 请求不合法 —— invalid_request 指请求体缺少 email/password/join_code 或不是 JSON；invalid_email 指 email 不是裸地址；password_too_short 指密码低于最小长度；invalid_password 指密码超过 72 字节（bcrypt 容量上限，与改密面同码）；invalid_display_name 指显示名超长。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_email
                          - password_too_short
                          - invalid_password
                          - invalid_display_name
        "403":
          description: 加入码无效 —— 码错、已吊销与无活跃码（自注册关闭）的统一答案，不区分。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_join_code
        "409":
          description: email 已被其他账号占用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - email_taken
        "429":
          description: 同一 email 的注册失败次数达到与登录共享的进程内限速上限；窗口与上限数值为信息性，客户端以 Retry-After 为准。
          headers:
            Retry-After:
              description: 距允许再次尝试的剩余秒数（整数）。
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - register_rate_limited
        "500":
          description: 服务端内部错误，账号与 session 均未创建。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/setup/status:
    get:
      operationId: getSetupStatus
      summary: 查询实例是否已初始化
      description: |-
        首启向导的探测端点（issue #122）：登录屏挂载时请求，仅返回 `initialized` 布尔——实例是否已存在任何 User，实时读库。未初始化（`false`）时登录屏切换首启向导；已初始化时一切设备只见常规登录。除该布尔外不返回任何信息。
      security: []
      responses:
        "200":
          description: 实例初始化状态，仅一个布尔字段。
          content:
            application/json:
              schema:
                type: object
                required:
                  - initialized
                properties:
                  initialized:
                    type: boolean
                    description: true 表示实例已存在任何 User（两连首启通道任一已胜出）；false 表示空库，首启向导可用。
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/setup/initialize:
    post:
      operationId: initializeInstance
      summary: 凭设置码创建首个 Admin 并直接进入应用
      description: |-
        首启设置码通道（issue #122，ADR-0015 2026-08-23 修订）：空库上持有设置码者自选 email、密码、显示名（可选）成为首个 Admin，`must_change_password=false`（密码自设），响应携带 session token，形态与登录相同，直接进入应用。设置码为 8 位 Crockford base32，由服务进程在空库启动时生成并以 `XXXX-XXXX` 分组打入运维日志一次，仅存进程内存；进程重启且仍空库则换新码、旧码作废；实例存在任何 User 后该码不复存在。服务端比对前统一 trim 与大写化（大小写不敏感）。

        单一写事务：首启 advisory lock → 复检空库（与 ADMIN_EMAIL/ADMIN_INITIAL_PASSWORD 环境变量通道先到先得，输家 409）→ 常量时间比对设置码 → INSERT 首个 admin → 写 setup_admin_created 审计行 → 发 session。码错计入与登录共享的 per-email 进程内限速，达到上限回答 429（数值为信息性，客户端依赖 Retry-After）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - setup_code
              properties:
                email:
                  type: string
                  format: email
                  description: 裸 RFC 5322 地址，服务端统一按小写规范化；空库事务内已证无冲突，该端点不回答 email_taken。
                password:
                  type: string
                  description: 本人自选的明文密码，经 TLS（或内网 http）传输，服务端只存哈希；最小长度 8。
                setup_code:
                  type: string
                  description: 运维日志披露的一次性 8 位 Crockford base32 设置码；服务端比对前统一大写化。任意不匹配的字符串（含超长值）统一按 403 invalid_setup_code 回答。
                display_name:
                  type: string
                  maxLength: 128
                  description: 可选显示名；缺省时服务端以 email 本地部分派生。
      responses:
        "201":
          description: 初始化成功，返回首个会话 token 与账号信息（形态同登录 200），用户为首个 Admin。
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expires_at
                  - user
                properties:
                  token:
                    type: string
                    description: opaque session token；客户端持有本体，服务端只存 hash，经 Authorization Bearer 头携带，永不进 URL。
                  expires_at:
                    type: string
                    format: date-time
                    description: 会话过期时刻（30 天滑动过期）。
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                      must_change_password:
                        type: boolean
                        description: 设置码通道密码本人自设，恒为 false。
        "400":
          description: 请求不合法 —— invalid_request 指请求体缺少 email/password/setup_code 或不是 JSON；invalid_email 指 email 不是裸地址；password_too_short 指密码低于最小长度；invalid_password 指密码超过 72 字节（bcrypt 容量上限）；invalid_display_name 指显示名超长。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_email
                          - password_too_short
                          - invalid_password
                          - invalid_display_name
        "403":
          description: 设置码无效 —— 不匹配本进程生成的一次性码的统一答案。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_setup_code
        "409":
          description: 实例已初始化 —— 写事务内 advisory lock 下复检空库发现已有 User：环境变量通道或另一并发 initialize 已胜出。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - instance_already_initialized
        "429":
          description: 同一 email 的失败尝试（码错）达到与登录共享的进程内限速上限；窗口与上限数值为信息性，客户端以 Retry-After 为准。
          headers:
            Retry-After:
              description: 距允许再次尝试的剩余秒数（整数）。
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - setup_rate_limited
        "500":
          description: 服务端内部错误，账号与 session 均未创建。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/users/me:
    get:
      operationId: getCurrentUser
      summary: 读取自己的账号信息
      description: 返回当前会话用户的账号信息（email、显示名、角色、must_change_password 标记），反映签发会话之后已提交的变更。must_change_password 为 true 的会话仍可读取（首登改密流需要账号展示）。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户账号信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      must_change_password:
                        type: boolean
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销；账号停用同样立即失去有效会话。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
    patch:
      operationId: updateCurrentUser
      summary: 修改自己的账号（显示名）
      description: |-
        自助修改显示名：去除首尾空白后须为 1–128 个 Unicode 字符（长度按字符计数，与 maxLength 语义一致；数值为信息性，客户端依据错误码分支），成功后返回更新后的完整账号（形状与 GET 相同），同一写事务写入 display_name_changed 审计行（含 from/to），后续目录与审计快照按新显示名生效。

        这是业务端点：must_change_password 为 true 的会话被 403 password_change_required 拒绝 —— 首登强制改密完成前仅 me / logout / change-password 可用。登录 email 仅 Admin 可改（独立命令），不在本端点。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - display_name
              properties:
                display_name:
                  type: string
                  maxLength: 128
                  description: 新显示名；长度按原始值以 Unicode 字符计数（与 maxLength 语义一致，非字节，空白计入长度、裁剪不豁免超长），去除首尾空白后须非空，存储按裁剪后值。
      responses:
        "200":
          description: 显示名已更新，返回更新后的账号信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      must_change_password:
                        type: boolean
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是含 display_name 的 JSON；invalid_display_name 指原始值超过 128 个 Unicode 字符（含首尾空白）或去除空白后为空。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_display_name
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: must_change_password 为 true：首登改密完成前业务端点被门禁拒绝。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - password_change_required
        "500":
          description: 服务端内部错误，更新未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/users:
    get:
      operationId: listUsers
      summary: 团队目录（活跃用户互见）
      description: |-
        返回活跃用户目录（v1 可见性模型：所有活跃用户可见全部活跃用户的 email 与显示名，ADR-0015）。仅返回 status=active 的账号，每条仅含 id、email、display_name 三字段 —— 角色、状态、凭据状态与登录历史只出现在管理列表。按 email 升序，支持共享分页与搜索契约（q 对 email 与 display_name 做不区分大小写的子串匹配）。
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: 可选搜索词，对 email 与 display_name 做不区分大小写的子串匹配；长度上限 256，超限回答 400 invalid_search。
          schema:
            type: string
            maxLength: 256
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: 一页目录。
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                  - page
                  - per_page
                  - total
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - email
                        - display_name
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        display_name:
                          type: string
                  page:
                    type: integer
                    minimum: 1
                  per_page:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                    description: 匹配搜索条件的总行数（跨页不变）。
        "400":
          description: 查询参数不合法 —— invalid_pagination 指 page 非正整数或 per_page 不在 1..100；invalid_search 指搜索词超过 256 字符。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_pagination
                          - invalid_search
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: must_change_password 为 true：首登改密完成前业务端点被门禁拒绝（#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - password_change_required
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
    post:
      operationId: createUser
      summary: 建号（Admin）
      description: |-
        管理员创建账号并设置初始密码（无邮件流程，ADR-0015）。建出的账号固定为 member 角色、active 状态、must_change_password=true（首次登录强制改密）；display_name 省略时取 email 本地部分。同一写事务写入 user_created 审计行。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - initial_password
              properties:
                email:
                  type: string
                  format: email
                  description: 裸 RFC 5322 地址，服务端统一按小写规范化；部署内唯一。
                initial_password:
                  type: string
                  description: 初始密码明文；最小长度 8（唯一密码策略）。
                display_name:
                  type: string
                  maxLength: 128
                  description: 可选显示名；省略或留白时取 email 本地部分。
      responses:
        "201":
          description: 账号已创建，返回完整管理视图。
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - status
                      - must_change_password
                      - last_login_at
                      - created_at
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      status:
                        type: string
                        enum:
                          - active
                          - disabled
                      must_change_password:
                        type: boolean
                      last_login_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                        description: 最近一次登录时刻；null 表示从未登录（删除资格判定）。
                      created_at:
                        type: string
                        format: date-time
        "400":
          description: 请求不合法 —— invalid_request 指请求体缺 email 或 initial_password；invalid_email 指非裸地址；password_too_short 指初始密码短于 8；invalid_display_name 指显示名超长。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_email
                          - password_too_short
                          - invalid_display_name
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "403":
          description: 已认证但非 Admin 角色；或 must_change_password 为 true（首登改密完成前业务端点被门禁拒绝，#101）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - forbidden
                          - password_change_required
        "409":
          description: email 已被另一个账号占用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - email_taken
        "500":
          description: 服务端内部错误，账号未创建。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
