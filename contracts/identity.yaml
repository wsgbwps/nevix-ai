# Identity Module API contract. The OpenAPI master references each Path Item here.
paths:
  /identity/auth/login:
    post:
      operationId: login
      summary: 登录并签发会话
      description: |-
        用 email 与密码登录：凭据正确且账号 active 时签发一个 opaque session token（30 天滑动过期，多设备并存），同一事务写入 session_created 审计行。token 只在本次响应中出现一次，服务端仅存其 hash。

        email 与密码错误统一回答 401 invalid_credentials（不区分账号是否存在）；账号 disabled 回答 403 account_disabled；同一 email 在窗口内连续失败达到上限后回答 429（数值为信息性，客户端依赖 Retry-After）。must_change_password 为 true 时仍可登录，响应携带该标记以驱动首登改密流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 裸 RFC 5322 地址（如 user@example.com）；display-name 形式被拒绝，服务端统一按小写规范化。
                password:
                  type: string
                  description: 明文密码，经 TLS（或内网 http）传输，服务端只存哈希。
                device_name:
                  type: string
                  maxLength: 128
                  description: 可选的设备名（如 "Elio 的 MacBook"），仅用于会话管理展示。
      responses:
        "200":
          description: 登录成功，返回新会话 token 与账号信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expires_at
                  - user
                properties:
                  token:
                    type: string
                    description: |-
                      opaque session token；客户端持有本体，服务端只存 hash。
                      经 Authorization Bearer 头携带，永不进 URL。
                  expires_at:
                    type: string
                    format: date-time
                    description: 会话过期时刻；每次带凭据使用且剩余不足一半时滑动顺延。
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      must_change_password:
                        type: boolean
                        description: true 表示当前密码是管理员设置的初始密码，客户端应强制改密。
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是含 email 与 password 的 JSON；invalid_email 指 email 不是裸地址；invalid_device_name 指 device_name 超长。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - invalid_email
                          - invalid_device_name
        "401":
          description: email 不存在或密码错误（统一防枚举响应）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_credentials
        "403":
          description: 账号已停用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - account_disabled
        "429":
          description: 同一 email 登录失败次数达到进程内限速上限；窗口与上限数值为信息性，客户端以 Retry-After 为准。
          headers:
            Retry-After:
              description: 距允许再次尝试的剩余秒数（整数）。
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - login_rate_limited
        "500":
          description: 服务端内部错误，会话未签发。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/auth/logout:
    post:
      operationId: logout
      summary: 登出当前会话
      description: |-
        吊销当前请求携带的 session（仅此一个）：其他设备的会话不受影响，同一事务写入 session_revoked 审计行。重复登出会因 guard 先拒绝已失效 token 而得到 401。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 当前会话已吊销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - logged_out
        "400":
          description: 请求不合法 —— invalid_request 指请求体不是 JSON 对象（空对象 {} 即可）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "500":
          description: 服务端内部错误，会话吊销未提交。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
  /identity/users/me:
    get:
      operationId: getCurrentUser
      summary: 读取自己的账号信息
      description: 返回当前会话用户的账号信息（email、显示名、角色、must_change_password 标记），反映签发会话之后已提交的变更。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户账号信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - display_name
                      - role
                      - must_change_password
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - member
                      must_change_password:
                        type: boolean
        "401":
          description: Bearer token 缺失、无效、已过期或已吊销；账号停用同样立即失去有效会话。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - unauthorized
        "500":
          description: 服务端内部错误。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - internal_error
components:
  schemas:
    Error:
      $ref: "./openapi.yaml#/components/schemas/Error"
