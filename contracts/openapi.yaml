openapi: 3.1.0
info:
  title: Nevix AI API
  version: 0.5.0
  description: |-
    API contract between desktop client and backend server.

    本文件是 Desktop ↔ Server 受信命令 seam 的单一事实源（见根目录 CONTEXT-MAP.md 与 docs/adr/0014-go-sole-trusted-data-plane.md）。关于本文件的约定：

    - **错误信封**：所有受信命令的错误响应统一使用 components/schemas/Error —— error 为 snake_case 机器码，是客户端分支处理的唯一依据；message 为人类可读文案，不作为程序判断依据。
    - **限流数值为信息性**：description 中出现的限流数值（如登录失败窗口）是当前部署策略，调整不算契约变更；客户端应依赖错误码与 Retry-After 响应头，而非硬编码数值。
    - **演进纪律**：只增不改 —— 新增命令加路径、响应只加字段，不改既有字段与错误码语义；不引入 /v1 版本前缀，直到出现真实的 breaking 需求。
    - **漂移防线**：响应级对照校验已作为测试断言落地：server 集成测试将其观察到的受信命令 HTTP 响应与本文件逐条对照 —— 状态码必须有文档条目、响应体必须含文档要求的必填字段、error 机器码必须属于该状态码文档化的枚举。
paths:
  /identity/auth/login:
    $ref: "./identity.yaml#/paths/~1identity~1auth~1login"
  /identity/auth/logout:
    $ref: "./identity.yaml#/paths/~1identity~1auth~1logout"
  /identity/auth/change-password:
    $ref: "./identity.yaml#/paths/~1identity~1auth~1change-password"
  /identity/users/me:
    $ref: "./identity.yaml#/paths/~1identity~1users~1me"
  /identity/users:
    $ref: "./identity.yaml#/paths/~1identity~1users"
  /identity/admin/users:
    $ref: "./identity.yaml#/paths/~1identity~1admin~1users"
  /identity/users/{userID}/disable:
    $ref: "./identity.yaml#/paths/~1identity~1users~1{userID}~1disable"
  /identity/users/{userID}/reset-password:
    $ref: "./identity.yaml#/paths/~1identity~1users~1{userID}~1reset-password"
  /identity/users/{userID}/email:
    $ref: "./identity.yaml#/paths/~1identity~1users~1{userID}~1email"
  /identity/users/{userID}/role:
    $ref: "./identity.yaml#/paths/~1identity~1users~1{userID}~1role"
  /identity/users/{userID}:
    $ref: "./identity.yaml#/paths/~1identity~1users~1{userID}"
  /identity/audit-logs:
    $ref: "./identity.yaml#/paths/~1identity~1audit-logs"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: 登录签发的 opaque session token（服务端只存 hash，可吊销、滑动过期）；缺失、无效、已过期或已吊销一律 401 unauthorized。token 经 Authorization 头携带，永不进 URL。
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: snake_case 机器码，客户端分支处理的唯一依据；所有受信命令复用本信封。
        message:
          type: string
          description: 人类可读文案，供展示或日志使用，不作为程序判断依据。
