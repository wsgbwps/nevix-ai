openapi: 3.1.0
info:
  title: Nevix AI API
  version: 0.13.0
  description: |-
    API contract between desktop client and backend server.

    本文件是 Desktop ↔ Server 受信命令 seam 的单一事实源（见根目录 CONTEXT-MAP.md 与 docs/adr/0014-go-sole-trusted-data-plane.md）。关于本文件的约定：

    - **错误信封**：所有受信命令的错误响应统一使用 components/schemas/Error —— error 为 snake_case 机器码，是客户端分支处理的唯一依据；message 为人类可读文案，不作为程序判断依据。
    - **限流数值为信息性**：description 中出现的限流数值（如登录失败窗口）是当前部署策略，调整不算契约变更；客户端应依赖错误码与 Retry-After 响应头，而非硬编码数值。
    - **演进纪律**：只增不改 —— 新增命令加路径、响应只加字段，不改既有字段与错误码语义；不引入 /v1 版本前缀，直到出现真实的 breaking 需求。
    - **漂移防线**：响应级对照校验已作为测试断言落地：server 集成测试将其观察到的受信命令 HTTP 响应与本文件逐条对照 —— 状态码必须有文档条目、响应体必须含文档要求的必填字段、error 机器码必须属于该状态码文档化的枚举。
paths:
  /health:
    get:
      summary: 实例健康与身份自述
      description: |-
        进程级健康端点，由 Go composition root 直接挂载（不属于任何业务 Module）。
        Desktop 连接探测以此响应判定目标是否为本产品的服务器（#153）：
        `status` 与 `service` 两者都对才算兼容，否则客户端报告 incompatible-server。
        响应字段是 Desktop ↔ Server 的受信 wire contract，修改即破坏兼容。
      operationId: getHealth
      responses:
        "200":
          description: 实例存活并自述为 Nevix 服务器。
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    enum:
                      - nevix-server
