# Creation Module API contract. The OpenAPI master references each Path Item here.
#
# 可见性基线（ADR-0016）：Creation Session 与 Reference Material 是 creator-private —— 只有创建者
# 能读写自己的会话与素材；其他 Member 或 Admin 即使猜测 id 也得到与不存在完全一致的 404 not_found，
# 不能读取 prompt、素材或私有媒体。本切片（AI Creation V1 06/16）不提供任何 Admin 治理路由。
#
# 文件流纪律（ADR-0014）：永久素材上传由 Go 签发单对象、短期、不可覆盖的 PUT 授权，
# Electron Main 从本地文件原生流式直传；finalize 与下载仍经 Go 权威校验/授权。Renderer 不接触
# 本地路径、文件字节、签名 URL/headers 或 Storage 凭据。
paths:
  /creation/sessions:
    post:
      operationId: createSession
      summary: 创建私有 Creation Session
      description: |-
        为当前创建者原子创建一个空的私有 Creation Session（草稿）。name 可选：省略或空白时存为空串，
        界面以本地化「未命名创作」兜底展示。成功即返回完整会话资源；失败不留任何半成品。
        该动作不创建 Generation Task、Provider Job 或任何计费事实。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 128
                  description: 会话名；去首尾空白后存储，最长 128 字符。
      responses:
        "201":
          description: 会话已创建并立即可继续。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSessions
      summary: 列出当前创建者的活跃 Creation Session
      description: |-
        只返回当前创建者自己的、未被逻辑删除的 Session，按 (created_at DESC, id DESC) 复合键序分页。
        其他 Member 的会话永不出现。复合 cursor 是包含全部排序键的不透明 token；
        next_cursor 为 null 表示没有下一页。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/keysetCursor"
      responses:
        "200":
          description: 当前页会话与下一页 cursor。
          content:
            application/json:
              schema:
                type: object
                required:
                  - sessions
                  - next_cursor
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreationSession"
                  next_cursor:
                    type: string
                    nullable: true
                    description: 继续向后翻页的复合 keyset cursor；null 表示已是最后一页。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}:
    get:
      operationId: getSession
      summary: 读取当前创建者的单个 Session
      description: |-
        选择（继续创作）入口：只对创建者可见；不存在、他人所有或已逻辑删除一律 404 not_found。
        已删除会话不因重新 GET 而复活。可编辑草稿是设备本地状态（ADR-0017），不经此接口往返；
        响应只携带会话资源本身。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "200":
          description: 会话资源。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameSession
      summary: 重命名当前创建者的 Session
      description: |-
        继续创作的轻量编辑：只有创建者可以重命名；目标不存在、他人所有或已删除一律 404。
        改名是幂等的普通写命令，不产生生成或计费事实。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: 新名字；去首尾空白后必须非空。
      responses:
        "200":
          description: 改名后的会话资源。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSession
      summary: 逻辑删除当前创建者的 Session
      description: |-
        删除立即从列表与选择路径隐藏会话，并阻止后续一切生成入口；保留既有记录用于追溯，
        成功形成的媒体资产的生命周期独立于会话。重复 DELETE 视为目标已消失，回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "204":
          description: 会话已逻辑删除且不再出现。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}/materials:
    get:
      operationId: listSessionMaterials
      summary: 列出会话内的 Reference Material
      description: |-
        牌堆数据源：只返回创建者自己该会话下的素材，按 (created_at ASC, id ASC) 复合键序分页
        （牌堆顺序 = 上传顺序）。目标会话不存在、他人所有或已删除回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/keysetCursor"
      responses:
        "200":
          description: 当前页素材与下一页 cursor。
          content:
            application/json:
              schema:
                type: object
                required:
                  - materials
                  - next_cursor
                properties:
                  materials:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferenceMaterial"
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}/reference-material-uploads:
    post:
      operationId: createReferenceMaterialUpload
      summary: 创建 creator-private Reference Material Upload
      description: |-
        为当前创建者在目标活跃 Session 内创建持久 Upload 租约，预留随机最终素材 identity/key，
        并返回仅可 PUT 该对象的 60 分钟授权。声明 kind 只用于申请阶段的 10/50/200 MiB 提前限额；
        内容定论由 finalize 的完整 Get/probe 给出。相同 creator + idempotency_key + payload 返回同一
        Upload 与原截止时间；payload 不同或租约已过期回答 409。签名 URL/headers 只能由可信
        Electron Main 在本次操作内存中使用。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceMaterialUploadCreateInput"
      responses:
        "201":
          description: Upload 已持久化并返回单对象短期 PUT 授权。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterialUploadAuthorization"
        "200":
          description: 幂等重放返回既有 Upload 与其原始截止时间；60 分钟内同时重新签发同等窄权限，进入 finalize-only 窗口后不再返回 upload_request。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterialUploadAuthorization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReferenceMaterialUploadConflict"
        "413":
          $ref: "#/components/responses/MaterialTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
  /creation/reference-material-uploads/{uploadID}:
    get:
      operationId: getReferenceMaterialUpload
      summary: 查询当前创建者的 Upload 状态
      description: PUT 响应不确定时的恢复入口；只返回租约与已完成素材，不返回签名 URL、请求头或对象 key。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/uploadID"
      responses:
        "200":
          description: creator-private Upload 状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterialUploadStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: finalizeReferenceMaterialUpload
      summary: 权威验证并 finalize Reference Material Upload
      description: |-
        Head 验证对象存在、实际长度与签名 upload-id metadata 后，Go 有界完整 Get 并计算 SHA-256，
        复用内容嗅探、结构 probe、实际 kind 限额与图片 envelope。ETag、文件名、Desktop metadata、
        声明 kind/MIME 都不是内容证明；声明 kind 与实际 kind 不一致时拒绝。只有全部验证与最终
        creator/Session 复核成功，才在短事务内创建不可变 Reference Material。pending 先以 CAS
        取得带 fencing token 的 30 分钟 verifying lease；外部 I/O 全部在事务外。live verifier 返回
        稳定可重试冲突，过期 lease 可接管，重复 finalized 返回同一素材。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/uploadID"
      responses:
        "200":
          description: 已 finalize；包含同一 Upload 与不可变素材。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterialUploadFinalized"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReferenceMaterialUploadConflict"
        "413":
          $ref: "#/components/responses/MaterialTooLarge"
        "415":
          $ref: "#/components/responses/MaterialUnsupportedMedia"
        "422":
          $ref: "#/components/responses/ReferenceMaterialFinalizeRejected"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
    delete:
      operationId: abortReferenceMaterialUpload
      summary: 终止未完成的 Reference Material Upload
      description: |-
        creator-private、幂等地把 pending/verifying Upload 置为 terminal，并立即按数据库中的精确
        object key 尝试删除；删除失败由持久 cleanup facts 与后台退避继续收敛。finalized Upload 不变。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/uploadID"
      responses:
        "200":
          description: 当前 Upload 状态；未完成 Upload 已进入 terminal。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterialUploadStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}/materials/from-result:
    post:
      operationId: createReferenceMaterialFromResult
      summary: 将当前创建者的成功生成结果转换为永久素材
      description: |-
        Server 在可信边界内读取当前创建者的成功 Task slot，并把结果流式写入当前 Object Storage，
        再执行与 Upload finalize 相同的完整 probe/hash 与最终 Session ownership 复核。结果 bytes、
        blob key、签名 URL/headers 均不进入 Renderer；新素材拥有独立 identity、object 与权利声明。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceMaterialFromResultInput"
      responses:
        "201":
          description: 新的不可变 Reference Material。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterial"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/MaterialTooLarge"
        "415":
          $ref: "#/components/responses/MaterialUnsupportedMedia"
        "422":
          $ref: "#/components/responses/MaterialUnreadableMedia"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
  /creation/materials/{materialID}:
    get:
      operationId: downloadReferenceMaterial
      summary: 流式下载参考素材文件
      description: |-
        经 Go 有界流式出口取回素材本体；支持单区间 Range 请求（206 + Content-Range），
        不支持多区间与非法区间（416）。响应携带 X-Content-SHA-256：全量下发时服务端在下发
        过程中即时校验 checksum，不一致将中断连接而非下发损坏数据；部分（206）下发无法从
        全文 digest 反推区间校验，客户端可凭该头部自行核对。仅创建者可读；他人/Admin 猜测 id
        得到 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/materialID"
        - name: Range
          in: header
          required: false
          description: 标准单区间字节范围（bytes=start-end | bytes=start- | bytes=-suffix）。
          schema:
            type: string
      responses:
        "200":
          description: 完整文件流，Content-Type 为素材的服务端定论 MIME。
          headers:
            Content-Length:
              description: 完整字节数。
              schema:
                type: integer
            X-Content-SHA-256:
              description: 全文件 SHA-256 十六进制摘要。
              schema:
                type: string
            Accept-Ranges:
              description: 固定为 bytes。
              schema:
                type: string
                enum:
                  - bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: 单区间部分内容，带 Content-Range 与 X-Content-SHA-256。
          headers:
            Content-Range:
              description: 实际下发区间（bytes start-end/total）。
              schema:
                type: string
            X-Content-SHA-256:
              description: 全文件 SHA-256 十六进制摘要。
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteReferenceMaterial
      summary: 删除当前创建者的 Reference Material
      description: 删除素材记录及其 blob：仅创建者可删；行删除事务成功后再清理 blob。他人/已删除回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/materialID"
      responses:
        "204":
          description: 素材记录已删除；blob 清理随 AfterCommit 执行。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/provider-connection:
    get:
      operationId: getProviderConnection
      summary: 查看实例唯一 AI Provider Connection（脱敏）
      description: |-
        Admin 治理视图：只返回管理状态、凭据状态、图片/视频独立 capability 与时间戳；
        不返回 Provider Key、Endpoint、模型 ID、供应商 request ID 或原始错误。实例尚无
        active Connection 时回答 404 provider_connection_not_configured。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前 active Connection 的脱敏治理视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: configureProviderConnection
      summary: 首次配置 Kapon Provider Connection
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.create）后，以候选
        Provider Key 执行一次 Connection Check（固定国内 Kapon 路由的 GET /v1/models，不生成
        真实媒体）。候选无效或临时不可用时丢弃候选且不落任何连接事实（Proof 已消费，不恢复）；
        通过则在主密钥 AEAD 保护下原子写入唯一 active Connection。每个实例最多一个 active
        Connection（数据库单例约束）。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionCredentialInput"
      responses:
        "201":
          description: Connection 已建立并返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionConfigureRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ProviderConnectionConfigureConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProviderCheckTemporarilyUnavailable"
    patch:
      operationId: updateProviderConnectionAdminState
      summary: 暂停或恢复 Connection
      description: |-
        只需有效 Admin Session（不消费 Proof）：enabled 允许后续新任务，paused 阻止新任务
        与尚未开始的 Provider 调用；已接受的外部工作继续收敛。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_state
              properties:
                admin_state:
                  type: string
                  enum:
                    - enabled
                    - paused
            description: 目标管理状态。
      responses:
        "200":
          description: 管理状态已更新并返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProviderConnection
      summary: 删除（终止）Connection
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.delete）后终止当前
        Connection：清除 Encrypted Provider Credential、释放「最多一个 active Connection」
        约束，但保留供既有事实与 Audit Log 追溯的非敏感历史 identity；此后重新配置产生新的
        Connection identity，不复活旧聚合。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  description: exact-action Reauthentication Proof（provider_connection.delete）。
      responses:
        "200":
          description: Connection 已终止；返回终止时的脱敏视图（密文已清除）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionDeleteRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "409":
          $ref: "#/components/responses/ReauthProofActionMismatch"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/provider-connection/credential:
    put:
      operationId: replaceProviderConnectionCredential
      summary: 替换 Provider Key（候选先行）
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.replace）后，以候选
        Provider Key 完成 Connection Check。候选失败即丢弃：旧密文与能力保持原样（Proof 已
        消费，不恢复）；候选通过则原子切换密文与状态 —— 即使只看到一个媒体的模型也可切换，
        另一媒体独立置为 unavailable。主密钥不可用且不存在 Object Storage 密文时，本命令可恢复
        共享密钥；一旦 Object Storage 密文存在，只能先走其显式 recovery，绝不静默换钥。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionCredentialInput"
      responses:
        "200":
          description: 候选已切换为当前凭据；返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionReplaceRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "409":
          $ref: "#/components/responses/ProviderConnectionReplaceConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProviderCheckTemporarilyUnavailable"
  /creation/provider-connection/recheck:
    post:
      operationId: recheckProviderConnection
      summary: 手动重检 Connection
      description: |-
        只需有效 Admin Session（不消费 Proof）。解密当前凭据并重新执行 Connection Check：
        临时故障（超时/429/5xx）不改写既有状态，只在视图中记录 temporarily_unavailable；
        主密钥不可用则置 credential_unavailable 并 fail closed，绝不静默重建主密钥。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 重检完成（或因临时故障保持原状态）；返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/media-capabilities:
    get:
      operationId: listMediaCapabilities
      summary: 按媒体归一化的能力可用性（Member surface）
      description: |-
        全体 active User 可读：只返回图片/视频各自的可用性、稳定原因与行动建议；
        不泄露 Endpoint、模型 ID、凭据细节、诊断或 Provider payload。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 分媒体能力状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/object-storage-connection:
    get:
      operationId: getObjectStorageConnection
      summary: 读取 Object Storage Connection 的脱敏 Admin 状态
      description: |-
        未配置时返回且只返回 state=unconfigured。已配置时返回规范化位置、实例级 revision、
        固定掩码后的 Access Key 状态和安全检查观察；永不返回 AK/SK、signed URL、object key 或原始供应商响应。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前脱敏配置状态；未配置不是错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createObjectStorageConnection
      summary: 首次创建并验证实例唯一的 Object Storage Connection
      description: |-
        Admin 在可信 HTTPS 上提交 exact-action proof、provider、region、bucket 与长期 AK/SK。
        Server 先在事务外规范化并完成完整 canary；只有全部成功才加密候选，并在一个 verified
        Creation 写事务中以单例 CAS/revision 激活和追加 object_storage_connection_created 审计。
        失败候选不持久化，proof 一经成功消费不恢复。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectStorageConnectionCreateInput"
      responses:
        "201":
          description: 候选通过 canary 并已原子激活。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "400":
          description: 请求字段/位置不合法、transport 不可信或 proof 无效。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - secure_transport_required
                          - reauth_proof_invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 已存在连接、proof 动作不匹配或 proof 已消费。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - object_storage_connection_exists
                          - reauth_proof_action_mismatch
                          - reauth_proof_already_consumed
        "410":
          description: proof 已过期。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - reauth_proof_expired
        "503":
          description: canary 或凭据建立失败；响应不区分供应商、网络与凭据细节。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - object_storage_unavailable
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: replaceObjectStorageConnection
      summary: 在空实例上替换 Object Storage 位置与凭据
      description: |-
        Admin 在可信 HTTPS 上提交 exact-action proof 与 expected_revision。Server 在事务外完整验证候选，
        仅当不存在永久对象且位置尚未永久冻结时，以 revision CAS 原子替换位置、凭据并追加脱敏审计。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectStorageConnectionMaintenanceInput"
      responses:
        "200":
          description: 候选验证成功且 CAS 替换完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "400":
          $ref: "#/components/responses/ObjectStorageMaintenanceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectStorageNotConfigured"
        "409":
          $ref: "#/components/responses/ObjectStorageMaintenanceConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteObjectStorageConnection
      summary: 删除尚未承载永久对象的 Object Storage Connection
      description: |-
        Admin 在可信 HTTPS 上提交独立 delete proof 与 expected_revision；只有位置未冻结且不存在
        归属事实时才以 CAS 清除密文并终止连接，同时追加脱敏审计。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectStorageConnectionDeleteInput"
      responses:
        "200":
          description: 连接已终止。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "400":
          $ref: "#/components/responses/ObjectStorageMaintenanceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectStorageNotConfigured"
        "409":
          $ref: "#/components/responses/ObjectStorageMaintenanceConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/object-storage-connection/recheck:
    post:
      operationId: recheckObjectStorageConnection
      summary: 使用已保存凭据重新检查 Object Storage Connection
      description: |-
        仅 Admin 可调用，不消费 Reauthentication Proof。检查只更新 checked_at 与
        completed/temporarily_unavailable 观察，不改变位置、凭据、状态或 revision。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 安全观察已更新。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectStorageNotConfigured"
        "409":
          $ref: "#/components/responses/ObjectStorageMaintenanceConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/object-storage-connection/credential:
    put:
      operationId: rotateObjectStorageCredential
      summary: 在冻结不变的位置轮换 Object Storage 凭据
      description: |-
        Admin 在可信 HTTPS 上提交独立 rotate proof、expected_revision 与新 AK/SK。
        Server 先在事务外验证候选，再以 revision CAS 原子替换密文并追加脱敏审计；失败保留旧密文与 revision。
        已签名 URL 仍依赖旧云端 key；计划轮换应保留旧 key 至少 24 小时以覆盖 Provider Transfer Object 窗口。紧急外部撤销可使在途操作 fail closed。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectStorageCredentialInput"
      responses:
        "200":
          description: 新凭据验证并激活。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "400":
          $ref: "#/components/responses/ObjectStorageMaintenanceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectStorageNotConfigured"
        "409":
          $ref: "#/components/responses/ObjectStorageMaintenanceConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/object-storage-connection/credential/recover:
    post:
      operationId: recoverObjectStorageCredential
      summary: 显式恢复丢失共享密钥后的 Object Storage 凭据
      description: |-
        仅 credential_unavailable 状态可用。Admin 在可信 HTTPS 上提交独立 recover proof、
        expected_revision 与当前位置的新 AK/SK；候选验证成功后建立共享密钥、以 CAS 写入新密文，
        并让同一旧密钥下其余密文 fail closed，永不静默重建。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectStorageCredentialInput"
      responses:
        "200":
          description: 共享密钥和当前 Object Storage 凭据已恢复。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageConnection"
        "400":
          $ref: "#/components/responses/ObjectStorageMaintenanceBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectStorageNotConfigured"
        "409":
          $ref: "#/components/responses/ObjectStorageMaintenanceConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/object-storage-capability:
    get:
      operationId: getObjectStorageCapability
      summary: 读取 active User 的最小 Object Storage capability
      description: |-
        未配置时只返回 available=false。ready 时只增加 provider、精确 upload_origin 与 connection_revision；
        credential_unavailable 时返回 available=false、provider 与 revision，但不返回 origin。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前最小 capability。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStorageCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/capability-manifest:
    get:
      operationId: getCapabilityManifest
      summary: 版本化 AI Provider Capability Manifest（Workbench 只镜像此处允许值）
      description: |-
        全体 active User 可读；Admin 与 Member 收到完全相同的 payload。
        Server 权威发布当前**可提交**的模型、媒体模式、比例、分辨率、数量/时长与
        参考素材上限（schema_version 标识载荷形状，manifest_version 标识能力内容版本）。
        每媒体 available=false 时只携带稳定 reason 与行动建议，值集合省略 ——
        下游 Workbench 据此保留失效草稿原值并阻止提交，无需猜测 Provider 状态。
        模型与参数集合是随代码发布的版本化合同；运行时可用性只由实例 Connection
        Check 的 Credential/Capability 与管理状态决定，不依赖部署侧附加文件。
        固定国内 Endpoint 与模型 allowlist 不由 Desktop 配置；无第二连接或 fallback。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前权威 Capability Manifest；只含当前可提交值。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}/tasks:
    post:
      operationId: submitGenerationTask
      summary: 以完整生成意图幂等提交不可变 Generation Task
      description: |-
        唯一的 Task 准入入口。可编辑草稿是设备本地状态（ADR-0017），Server 不存储草稿；
        请求携带提交时刻的完整生成意图（prompt、目标媒体、manifest version、模型/模式/参数
        与有序 Reference Material identity/role）及 creator-scoped idempotency_key。准入在
        同一短事务内原子校验意图的结构信封、manifest 版本、Reference identity/role/kind
        与参数，冻结为不可变 Generation Specification，并按固定顺序执行治理检查
        （provider credit → instance 月度 → member 月度 → instance 频率 → member 频率 →
        member 分媒体并发）；一次成功提交原子创建 Specification、Task、N 个稳定有序 slot、
        首个 pending Provider Job、queue item 与并发 reservation。
        同 key 同 payload 幂等返回既有 Task（200，不重复计数）；同 key 不同 payload 返回 409
        idempotency_payload_conflict。治理拒绝只持久化本次结构有效尝试事实，不创建
        Task/Job/queue/reservation。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmitInput"
      responses:
        "201":
          description: Task 已原子创建；slot 以派生投影状态返回。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskDetail"
        "200":
          description: 幂等重放 —— 同 key 同 payload 返回既有 Task，不重复计数。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TaskGovernanceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskConflict"
        "422":
          $ref: "#/components/responses/TaskIntentRejected"
        "429":
          $ref: "#/components/responses/TaskGovernanceRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSessionGenerationTasks
      summary: 列出本 Session 的 Generation Task（creator-private）
      description: |-
        只返回当前创建者自己的该 Session 任务，按 (created_at DESC, id DESC) 复合 keyset 序分页。
        每次 quantity=N 的提交永远稳定呈现 N 个有序 slot；部分失败不重排结果。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/keysetCursor"
      responses:
        "200":
          description: 当前页任务与下一页 cursor。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/tasks/{taskID}:
    get:
      operationId: getGenerationTask
      summary: 查看 Generation Task 详情（creator-private）
      description: |-
        返回任务、全部 slot 的派生/终态、以及创建者私有的冻结 Generation Specification。
        其他 Member 的任务与不存在完全一致地 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/taskID"
      responses:
        "200":
          description: 任务详情（含 slot 与冻结规格）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/tasks/{taskID}/cancel:
    post:
      operationId: cancelGenerationTask
      summary: 请求取消 Generation Task（best effort）
      description: |-
        记录取消意图并立即收敛可立即取消的工作：未提交外部调用的任务直接 cancelled；
        已接受的外部工作继续按权威结果收敛（cancelling），已取得的有效输出保留并继续转存。
        幂等：对已终态任务重复取消返回其当前状态。取消不丢弃任何已形成的成功槽位。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/taskID"
      responses:
        "200":
          description: 已记录取消意图后的任务状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/tasks/{taskID}/retry:
    post:
      operationId: retryUncompletedSlots
      summary: 只重试未完成项 —— 以原冻结规格创建新 Task
      description: |-
        原 Task 保持不可变。新 Task 复制原冻结规格但 quantity 仅覆盖未完成槽位
        （成功槽位不被重复生成或重复计费），并按与首次提交完全相同的治理准入
        （新 idempotency_key、月计数、reservation）执行。仅终态且存在未完成槽位的任务可重试。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/taskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRetryInput"
      responses:
        "201":
          description: 新 Task 已原子创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TaskGovernanceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskRetryConflict"
        "422":
          $ref: "#/components/responses/TaskIntentRejected"
        "429":
          $ref: "#/components/responses/TaskGovernanceRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/tasks/{taskID}/slots/{slotIndex}/result:
    get:
      operationId: downloadGenerationSlotResult
      summary: 下载成功槽位的已验证输出（creator-private 有界流）
      description: |-
        只对创建者开放；流式经 Go 有界传输，不暴露 Storage 凭据。仅成功槽位携带输出；
        其他槽位与外来任务一律 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/taskID"
        - $ref: "#/components/parameters/slotIndex"
      responses:
        "200":
          description: 输出字节流（Content-Type 为转存时验证的 MIME）。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/events:
    get:
      operationId: streamCreationEvents
      summary: creator-scoped 失效通知流（SSE）
      description: |-
        text/event-stream。事件只表示"当前 User 的 creation 状态已失效"，不携带任何私有
        payload；持久状态 commit 之后才发布。约 20 秒一次 heartbeat 注释行。Authorization
        走 header，token 不进 URL；不实现 Last-Event-ID —— 客户端断流后先全量 refetch，
        再恢复流并由轮询在 10 秒内收敛。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE 事件流。
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /creation/generation-governance:
    get:
      operationId: getGenerationGovernance
      summary: 查看实例与 User 治理配置（Admin）
      description: |-
        返回 instance 默认与全部 User 覆盖。未设置字段不限，显式 0 禁止相应范围的新 Task。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 治理配置视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationGovernanceView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/generation-governance/instance:
    put:
      operationId: putInstanceGovernance
      summary: 配置实例级治理（Admin）
      description: |-
        整行替换四个可选上限（null 表示清除为未设置）。变更立即影响新提交，不取消已接受
        Task，不清空滚动窗口或当月计数。每次变更写入脱敏 Audit Log。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceLimits"
      responses:
        "200":
          description: 已保存的实例配置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/generation-governance/users/{userID}:
    put:
      operationId: putUserGovernance
      summary: 配置任意 active User 的治理覆盖（Admin，含自己与其他 Admin）
      description: 整行替换四个可选上限；User 覆盖逐字段优先于 instance 默认。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceLimits"
      responses:
        "200":
          description: 已保存的 User 覆盖。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/provider-connection/credit-block:
    delete:
      operationId: clearProviderCreditBlock
      summary: 手动解除 provider_credit_blocked（Admin）
      description: |-
        Provider 402 建立的持久额度阻止只能由 Admin 在 Kapon 处理完成后手动解除；
        下一次显式提交探测，若仍 402 则重新阻止。解除与建立均写入脱敏 Audit Log。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 已解除。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    sessionID:
      name: sessionID
      in: path
      required: true
      description: 目标 Creation Session id（UUID）。
      schema:
        type: string
        format: uuid
    materialID:
      name: materialID
      in: path
      required: true
      description: 目标 Reference Material id（UUID）。
      schema:
        type: string
        format: uuid
    uploadID:
      name: uploadID
      in: path
      required: true
      description: creator-private Reference Material Upload id（UUID）。
      schema:
        type: string
        format: uuid
    pageLimit:
      name: limit
      in: query
      required: false
      description: 页大小，1..200，默认 50。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    keysetCursor:
      name: cursor
      in: query
      required: false
      description: 上页 next_cursor 原样回传的复合 keyset 令牌；缺省从首页开始。
      schema:
        type: string
    taskID:
      name: taskID
      in: path
      required: true
      description: 目标 Generation Task id（UUID）。
      schema:
        type: string
        format: uuid
    slotIndex:
      name: slotIndex
      in: path
      required: true
      description: 稳定有序 slot 序号（0 起始）。
      schema:
        type: integer
        minimum: 0
        maximum: 3
    userID:
      name: userID
      in: path
      required: true
      description: 目标 active User id（UUID）。
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求不合法 —— invalid_request 指请求体不是约定形状的 JSON 或字段边界违规；invalid_cursor 指 cursor 不是合法的复合分页令牌。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - invalid_cursor
    Unauthorized:
      description: 未认证 —— 缺失、无效、过期或已吊销的 session token。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - unauthorized
    NotFound:
      description: |-
        not_found —— 目标不存在、不属于当前创建者、已被逻辑删除，或路径 id 本身不是合法 UUID；
        四者不可区分（防枚举与防格式探测），样式与 /identity 各目标路由一致。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - not_found
    ObjectStorageMaintenanceBadRequest:
      description: 请求形状或位置不合法、transport 不可信，或 proof 无效。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
    ObjectStorageNotConfigured:
      description: 当前没有 active Object Storage Connection。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - object_storage_connection_not_configured
    ObjectStorageMaintenanceConflict:
      description: revision、永久位置锁、归属事实、恢复状态或单次 proof 与当前命令冲突。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - object_storage_connection_revision_conflict
                      - object_storage_location_frozen
                      - object_storage_recovery_required
                      - object_storage_recovery_not_required
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
    ObjectStorageUnavailable:
      description: Object Storage 候选检查、实例未配置或当前凭据/服务暂时不可用；不暴露供应商原始详情。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - object_storage_unavailable
    MaterialTooLarge:
      description: material_too_large —— 上传体积超过该媒体类别的上限（image 10 MiB、audio 50 MiB、video 200 MiB）；超限流被服务端中断。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_too_large
    MaterialUnsupportedMedia:
      description: material_unsupported_media —— 内容嗅探出的媒体类别不在 image/video/audio 白名单内，或扩展名与内容类别不一致。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_unsupported_media
    MaterialUnreadableMedia:
      description: material_unreadable_media —— 结构可识别但无法权威解码（尺寸/像素/时长探测失败），素材不会被入库。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_unreadable_media
    ReferenceMaterialFinalizeRejected:
      description: |-
        finalize 权威验证拒绝 —— material_unreadable_media 表示媒体无法解码；
        material_upload_size_mismatch 表示 Head 长度与租约声明不同；
        material_upload_metadata_mismatch 表示签名 upload-id metadata 缺失或不一致。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_unreadable_media
                      - material_upload_size_mismatch
                      - material_upload_metadata_mismatch
    ReferenceMaterialUploadConflict:
      description: |-
        409 —— idempotency_payload_conflict 表示同一 creator 的 key 已绑定不同 payload；
        reference_material_upload_expired/terminal 表示旧 Upload 必须使用新 key；verifying 表示已有
        live verifier，应稍后重试；put_required 表示 PUT 窗口内对象尚不存在，应重选文件继续同一 Upload。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - idempotency_payload_conflict
                      - reference_material_upload_expired
                      - reference_material_upload_terminal
                      - reference_material_upload_verifying
                      - reference_material_upload_put_required
    ReferenceMaterialUploadExpired:
      description: reference_material_upload_expired —— 租约已越过最终截止时间，必须创建新的 Upload。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reference_material_upload_expired
    RangeNotSatisfiable:
      description: 非法或不可满足的 Range（多区间、语法错误、start 越过 EOF）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - range_not_satisfiable
    Forbidden:
      description: forbidden —— 认证有效但该命令要求 Admin 角色（ADR-0015 guard 词汇）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - forbidden
    ProviderConnectionNotConfigured:
      description: provider_connection_not_configured —— 实例尚无 active AI Provider Connection。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_connection_not_configured
    ProviderConnectionConfigureRejected:
      description: |-
        首次配置被拒绝 —— invalid_request（形状/字段边界）、secure_transport_required（未证明
        HTTPS）、reauth_proof_invalid（Proof 未知或不属于该 Admin）、provider_credential_invalid
        （候选 Key 被固定国内 Kapon 路由的 /v1/models 判定无效；候选被丢弃，无连接事实落库）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
                      - provider_credential_invalid
    ProviderConnectionConfigureConflict:
      description: |-
        409 —— provider_connection_exists（实例已有 active Connection，单例约束）；
        reauth_proof_action_mismatch（Proof 绑定其他 action）；reauth_proof_already_consumed
        （Proof 单次消费已用掉，不恢复）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_connection_exists
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
    ProviderConnectionReplaceRejected:
      description: |-
        替换被拒绝且旧凭据/能力保持原样 —— invalid_request、secure_transport_required、
        reauth_proof_invalid、provider_credential_invalid（候选被丢弃）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
                      - provider_credential_invalid
    ProviderConnectionReplaceConflict:
      description: |-
        Proof 动作/单次消费冲突，或共享密钥丢失且 Object Storage 密文要求先完成显式恢复。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
                      - object_storage_recovery_required
    ProviderConnectionDeleteRejected:
      description: |-
        删除被拒绝 —— invalid_request、secure_transport_required、reauth_proof_invalid。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
    ReauthProofActionMismatch:
      description: |-
        409 —— reauth_proof_action_mismatch（Proof 绑定其他 action，仍可用于其自身 action）；
        reauth_proof_already_consumed（单次消费已发生，不恢复）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
    ReauthProofExpired:
      description: reauth_proof_expired —— 五分钟有效期已过。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reauth_proof_expired
    ProviderCheckTemporarilyUnavailable:
      description: |-
        provider_check_temporarily_unavailable —— 固定国内 Kapon 路由对 /v1/models 的检查
        遇到超时、429 或临时 5xx：候选被丢弃、既有状态不被永久改写，稍后重试。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_check_temporarily_unavailable
    TaskGovernanceForbidden:
      description: 治理阻止（持久类）—— 固定 machine reason，按 provider credit、instance 月度、member 月度的稳定顺序返回第一个命中项。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_credit_blocked
                      - instance_monthly_generation_limit_reached
                      - member_monthly_generation_limit_reached
    TaskGovernanceRateLimited:
      description: 治理阻止（可重试类）—— instance/member 频率（滚动 60 秒跨媒体）与 member 分媒体并发；响应携带 Retry-After。
      headers:
        Retry-After:
          description: 建议的重试等待秒数（频率窗口剩余时间或固定建议值）。
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - instance_generation_rate_limited
                      - member_generation_rate_limited
                      - member_generation_concurrency_limited
    TaskConflict:
      description: 幂等冲突 —— 同 key 不同 payload；请求内没有可改写的服务端草稿状态（ADR-0017）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - idempotency_payload_conflict
    TaskRetryConflict:
      description: 重试条件不满足 —— 任务未终态，或没有未完成槽位可重试。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - task_not_terminal
                      - no_incomplete_slots
    TaskIntentRejected:
      description: 意图载荷拒绝 —— 结构不完整/非法的意图、意图值超出当前 manifest，或目标媒体当前不可用；不创建 Task。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - intent_not_ready
                      - capability_stale
                      - media_unavailable
                      - invalid_request
    InternalError:
      description: 服务端内部错误，动作未完成。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - internal_error
  schemas:
    Error:
      $ref: "./openapi.yaml#/components/schemas/Error"
    CreationSession:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 会话名；允许空串（界面以本地化「未命名创作」兜底）。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskSubmitInput:
      type: object
      required:
        - idempotency_key
        - manifest_version
        - references
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: creator-scoped 幂等键；"再次生成"与"只重试未完成项"必须使用新键。
        prompt:
          type: string
          maxLength: 2000
          description: 生成意图提示词；提交时不得为空（intent_not_ready）。
        media_type:
          type: string
          nullable: true
          enum:
            - image
            - video
        manifest_version:
          type: integer
          minimum: 1
          description: 提交者所依据 Capability Manifest 的 manifest_version；Server 在准入边界比对。
        model:
          type: string
          nullable: true
          maxLength: 128
        mode:
          type: string
          nullable: true
          maxLength: 64
        ratio:
          type: string
          nullable: true
          maxLength: 16
        resolution:
          type: string
          nullable: true
          maxLength: 16
        quantity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
        duration_seconds:
          type: integer
          nullable: true
          minimum: 1
        references:
          type: array
          maxItems: 14
          description: 有序 Reference Material identity/role；顺序即牌堆顺序，素材必须属于本会话。结构信封为最宽供应商上限（14），分模型上限由准入按 manifest 冻结时校验。
          items:
            $ref: "#/components/schemas/DraftReferenceInput"
    DraftReferenceInput:
      type: object
      required:
        - material_id
        - role
      properties:
        material_id:
          type: string
          format: uuid
          description: 引用的 Reference Material identity；必须属于本会话。
        role:
          type: string
          enum:
            - reference
            - first_frame
            - last_frame
            - omni
    ReferenceMaterial:
      type: object
      required:
        - id
        - kind
        - file_name
        - mime_type
        - byte_size
        - checksum_sha256
        - claims_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - image
            - video
            - audio
        file_name:
          type: string
          maxLength: 255
          description: 上传时声明的原始文件名，仅供创建者本人展示。
        mime_type:
          type: string
          description: 服务端嗅探定论的 MIME（权威）。
        byte_size:
          type: integer
          minimum: 1
        width_px:
          type: integer
          nullable: true
          description: 图像/视频实际像素宽；音频为 null。
        height_px:
          type: integer
          nullable: true
          description: 图像/视频实际像素高；音频为 null。
        pixel_count:
          type: integer
          nullable: true
          description: 图像总像素数；其余为 null。
        duration_ms:
          type: integer
          nullable: true
          description: 音频/视频实际时长（毫秒）；图像为 null。
        checksum_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 全文件 SHA-256 十六进制摘要。
        claims_version:
          type: integer
          minimum: 1
          description: 上传动作确认的权利声明版本；升级只作用于以后新建的素材，不追溯阻塞既有素材。
        created_at:
          type: string
          format: date-time
    ReferenceMaterialUploadCreateInput:
      type: object
      additionalProperties: false
      required:
        - idempotency_key
        - file_name
        - declared_kind
        - declared_mime_type
        - declared_byte_size
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: creator-scoped 幂等键；过期后必须生成新键。
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          description: 仅供展示与扩展名一致性校验，不是内容证明。
        declared_kind:
          type: string
          enum: [image, video, audio]
          description: 只用于申请阶段提前限额；finalize 以实际 probe 为准并要求 family 一致。
        declared_mime_type:
          type: string
          minLength: 1
          maxLength: 255
          description: 绑定到 PUT Content-Type 的传输声明，不是实际内容证明。
        declared_byte_size:
          type: integer
          minimum: 1
          maximum: 209715200
          description: 绑定租约并由 Head 复核；仍受 declared kind 的更窄限额约束。
    ReferenceMaterialUpload:
      type: object
      additionalProperties: false
      required:
        - id
        - session_id
        - status
        - file_name
        - declared_kind
        - declared_mime_type
        - declared_byte_size
        - claims_version
        - connection_revision
        - put_expires_at
        - finalize_expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, verifying, finalized, terminal]
        file_name:
          type: string
          maxLength: 255
        declared_kind:
          type: string
          enum: [image, video, audio]
        declared_mime_type:
          type: string
        declared_byte_size:
          type: integer
          minimum: 1
        claims_version:
          type: integer
          minimum: 1
        connection_revision:
          type: integer
          minimum: 1
        put_expires_at:
          type: string
          format: date-time
        finalize_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
          nullable: true
    ReferenceMaterialUploadAuthorization:
      type: object
      additionalProperties: false
      required: [upload]
      properties:
        upload:
          $ref: "#/components/schemas/ReferenceMaterialUpload"
        upload_request:
          type: object
          additionalProperties: false
          required: [method, url, headers, expires_at]
          properties:
            method:
              type: string
              enum: [PUT]
            url:
              type: string
              format: uri
              description: 当前 Upload 单对象短期授权；只允许存在于 Electron Main 操作内存。
            headers:
              type: object
              additionalProperties:
                type: string
              description: 闭集签名头：Content-Type、provider upload-id metadata 与防覆盖头。
            expires_at:
              type: string
              format: date-time
          description: 仅在原 60 分钟 PUT 窗口内出现；之后 Upload 仍可 finalize 到 90 分钟截止。
    ReferenceMaterialUploadStatus:
      type: object
      additionalProperties: false
      required: [upload]
      properties:
        upload:
          $ref: "#/components/schemas/ReferenceMaterialUpload"
        material:
          allOf:
            - $ref: "#/components/schemas/ReferenceMaterial"
          nullable: true
    ReferenceMaterialUploadFinalized:
      type: object
      additionalProperties: false
      required: [upload, material]
      properties:
        upload:
          $ref: "#/components/schemas/ReferenceMaterialUpload"
        material:
          $ref: "#/components/schemas/ReferenceMaterial"
    ReferenceMaterialFromResultInput:
      type: object
      additionalProperties: false
      required: [task_id, slot_index, file_name]
      properties:
        task_id:
          type: string
          format: uuid
        slot_index:
          type: integer
          minimum: 0
          maximum: 3
        file_name:
          type: string
          minLength: 1
          maxLength: 255
    ProviderConnectionCredentialInput:
      type: object
      required:
        - proof
        - provider_key
      properties:
        proof:
          type: string
          description: exact-action Reauthentication Proof（create 或 replace 视命令而定）。
        provider_key:
          type: string
          minLength: 1
          maxLength: 4096
          description: 候选 Kapon Provider Key；只在服务端检查/加密期间短暂存在，永不回显。
    ObjectStorageConnectionCreateInput:
      type: object
      required:
        - proof
        - provider
        - region
        - bucket
        - access_key_id
        - secret_access_key
      properties:
        proof:
          type: string
          description: 绑定 object_storage_connection.create 的单次 Reauthentication Proof。
        provider:
          type: string
          description: 大小写与首尾空白规范化后必须为 oss 或 cos。
        region:
          type: string
          maxLength: 32
          description: 官方公网 region；Server 规范化并拒绝 internal/accelerate/CDN 等 endpoint 变体。
        bucket:
          type: string
          maxLength: 63
          description: provider 官方 bucket 名；Server 规范化后推导唯一公网 virtual-host endpoint。
        access_key_id:
          type: string
          minLength: 1
          maxLength: 1024
          description: 长期最小权限 Access Key ID；只在 canary/加密期间短暂存在，永不回显。
        secret_access_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: 长期最小权限 Secret Access Key；只在 canary/加密期间短暂存在，永不回显。
    ObjectStorageConnectionMaintenanceInput:
      type: object
      required:
        - proof
        - expected_revision
        - provider
        - region
        - bucket
        - access_key_id
        - secret_access_key
      properties:
        proof:
          type: string
          description: 绑定 object_storage_connection.replace 的单次 Reauthentication Proof。
        expected_revision:
          type: integer
          minimum: 1
          description: Admin 最近读取的连接 revision；CAS 冲突必须重新加载。
        provider:
          type: string
          enum: [oss, cos]
        region:
          type: string
          minLength: 1
          maxLength: 32
        bucket:
          type: string
          minLength: 1
          maxLength: 63
        access_key_id:
          type: string
          minLength: 1
          maxLength: 1024
        secret_access_key:
          type: string
          minLength: 1
          maxLength: 1024
    ObjectStorageCredentialInput:
      type: object
      required:
        - proof
        - expected_revision
        - access_key_id
        - secret_access_key
      properties:
        proof:
          type: string
          description: 绑定 rotate 或 recover 命令的单次 exact-action Reauthentication Proof。
        expected_revision:
          type: integer
          minimum: 1
        access_key_id:
          type: string
          minLength: 1
          maxLength: 1024
        secret_access_key:
          type: string
          minLength: 1
          maxLength: 1024
    ObjectStorageConnectionDeleteInput:
      type: object
      required:
        - proof
        - expected_revision
      properties:
        proof:
          type: string
          description: 绑定 object_storage_connection.delete 的单次 Reauthentication Proof。
        expected_revision:
          type: integer
          minimum: 1
    ObjectStorageConnection:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum: [unconfigured, ready, credential_unavailable]
        provider:
          type: string
          enum: [oss, cos]
        region:
          type: string
        bucket:
          type: string
        revision:
          type: integer
          minimum: 1
        location_frozen:
          type: boolean
          description: 一旦首个永久对象落地便永久为 true；只阻止位置替换和删除，不阻止同位置凭据轮换。
        credential:
          type: object
          required:
            - access_key_id_masked
            - secret_access_key_configured
          properties:
            access_key_id_masked:
              type: string
              description: 固定 **** 前缀加 Access Key ID 最后至多四字符；不是可恢复的凭据。
            secret_access_key_configured:
              type: boolean
              enum: [true]
        observation:
          type: object
          required:
            - checked_at
            - outcome
          properties:
            checked_at:
              type: string
              format: date-time
            outcome:
              type: string
              enum: [completed, temporarily_unavailable]
    ObjectStorageCapability:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - available
          properties:
            available:
              const: false
        - type: object
          additionalProperties: false
          required:
            - available
            - provider
            - upload_origin
            - connection_revision
          properties:
            available:
              const: true
            provider:
              type: string
              enum: [oss, cos]
            upload_origin:
              type: string
              format: uri
              description: ready 时返回的精确官方 HTTPS origin。
            connection_revision:
              type: integer
              minimum: 1
        - type: object
          additionalProperties: false
          required:
            - available
            - provider
            - connection_revision
          properties:
            available:
              const: false
            provider:
              type: string
              enum: [oss, cos]
            connection_revision:
              type: integer
              minimum: 1
    ProviderConnection:
      type: object
      required:
        - id
        - admin_state
        - credential_state
        - image_capability
        - video_capability
        - created_at
        - updated_at
        - needs_attention
      properties:
        id:
          type: string
          format: uuid
        admin_state:
          type: string
          enum:
            - enabled
            - paused
        credential_state:
          type: string
          enum:
            - checking
            - valid
            - invalid
            - credential_unavailable
        image_capability:
          type: string
          enum:
            - checking
            - available
            - unavailable
        video_capability:
          type: string
          enum:
            - checking
            - available
            - unavailable
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次 Connection Check 的时间（包括以 temporarily_unavailable 结束的尝试）；从未检查为 null。
        last_check_outcome:
          type: string
          nullable: true
          enum:
            - completed
            - temporarily_unavailable
          description: 最近一次检查的结局；临时故障不永久改写既有状态。
        needs_attention:
          type: boolean
          description: 派生提示（非持久状态）：凭据无效/不可用、暂停、任一媒体不可用或存在持久额度阻止时为 true。
        credit_blocked_at:
          type: string
          format: date-time
          nullable: true
          description: Provider 402 建立的连接级持久额度阻止时刻；仅 Admin 可见，只能手动解除。
    MediaCapabilities:
      type: object
      required:
        - image
        - video
      properties:
        image:
          $ref: "#/components/schemas/MediaCapabilityStatus"
        video:
          $ref: "#/components/schemas/MediaCapabilityStatus"
    MediaCapabilityStatus:
      type: object
      required:
        - status
        - reason
        - action
      properties:
        status:
          type: string
          enum:
            - checking
            - available
            - unavailable
        reason:
          type: string
          nullable: true
          enum:
            - not_configured
            - connection_paused
            - credential_invalid
            - credential_unavailable
            - model_unavailable
            - checking
          description: 不可用/检查中的稳定机器原因；可用时为 null。
        action:
          type: string
          nullable: true
          enum:
            - wait
            - contact_admin
          description: 稳定行动建议；可用时为 null。
    CapabilityManifest:
      type: object
      required:
        - schema_version
        - manifest_version
        - image
        - video
      properties:
        schema_version:
          type: integer
          enum:
            - 2
          description: 载荷形状版本；字段结构变化时递增。v2：媒体模型改为 models 列表（各带分辨率档位与默认档）。
        manifest_version:
          type: integer
          description: 能力内容版本；源代码中的能力集合变化（扩张或移除）时递增。
          minimum: 1
        image:
          $ref: "#/components/schemas/CapabilityMedia"
        video:
          $ref: "#/components/schemas/CapabilityMedia"
    CapabilityMedia:
      type: object
      required:
        - available
      description: |-
        一个媒体的当前可提交能力。available=false 时必带稳定 reason 与行动建议
        （结构化字段），且值集合全部省略 —— 消费方据此保留失效草稿原值并阻止提交；
        available=true 时 reason/action 省略，值集合齐全。
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
            - not_configured
            - checking
            - credential_invalid
            - credential_unavailable
            - connection_paused
            - model_unavailable
          description: 实例连接不可用/检查中的稳定机器原因；可用时省略。
        action:
          type: string
          nullable: true
          enum:
            - wait
            - contact_admin
          description: 稳定行动建议；可用时省略。
        models:
          type: array
          nullable: true
          description: 该媒体的版本化 allowlist 模型（固定顺序）；各模型携带自己的分辨率档位与默认档。可用时非空。
          items:
            $ref: "#/components/schemas/CapabilityModel"
        modes:
          type: array
          nullable: true
          description: 当前可提交的媒体模式（固定顺序）；可用时非空。
          items:
            $ref: "#/components/schemas/CapabilityMode"
        ratios:
          type: array
          nullable: true
          description: 图片可提交比例（固定顺序，来自版本化 supported ratios）；仅 image 且可用时非空。
          items:
            type: string
            enum:
              - "1:1"
              - "4:3"
              - "3:4"
              - "16:9"
              - "9:16"
              - "3:2"
              - "2:3"
              - "21:9"
        quantities:
          type: array
          nullable: true
          description: 图片可提交数量（升序 1..4）；仅 image 且可用时非空。
          items:
            type: integer
            minimum: 1
            maximum: 4
        durations:
          type: array
          nullable: true
          description: 视频可提交时长（秒，升序）；仅 video 且可用时非空。
          items:
            type: integer
            minimum: 1
        defaults:
          type: object
          nullable: true
          description: 媒体级维度的推荐默认值（ratio/quantity/duration）；分辨率默认档在各 models 条目上。可用时非空。
          properties:
            ratio:
              type: string
            quantity:
              type: integer
            duration:
              type: integer
        prompt:
          type: object
          nullable: true
          description: prompt 长度包络（Unicode 字符）；可用时非空。
          required:
            - min_chars
            - max_chars
          properties:
            min_chars:
              type: integer
            max_chars:
              type: integer
        reference_material:
          nullable: true
          description: 参考素材总包络（跨模式最宽边界）；逐模式边界见 CapabilityMode。可用时非空。
          $ref: "#/components/schemas/ReferenceMaterialPolicy"
    CapabilityModel:
      type: object
      required:
        - model
        - resolutions
        - default_resolution
      description: 一个版本化 allowlist 模型及其分辨率档位；图片为双模型（档位互不相同），视频为单条目。图片模型额外发布各「档位×宽高比」的像素尺寸（展示用；提交时服务端按同一映射解析 size）。
      properties:
        model:
          type: string
          description: 模型 ID（提交 Task 时的 model 值）。
        resolutions:
          type: array
          description: 该模型可提交的分辨率档位（固定顺序）。
          items:
            type: string
        default_resolution:
          type: string
          description: 该模型的推荐默认档；必属本条目 resolutions。
        max_reference_images:
          type: integer
          description: 该模型允许的最大图片参考素材数量（供应商逐模型契约）；仅图片模型发布。模式 total 是跨模型最宽边界，提交时按所选模型收紧。
        sizes:
          type: array
          description: 该模型每个「分辨率档位×宽高比」组合对应的供应商像素尺寸；仅图片模型发布。条目的 resolution 必属本条目 resolutions，ratio 必属媒体 ratios。
          items:
            $ref: "#/components/schemas/CapabilitySize"
    CapabilitySize:
      type: object
      required:
        - resolution
        - ratio
        - width
        - height
      description: 一个「分辨率档位×宽高比」组合的像素尺寸（与供应商 size 契约一一对应）。
      properties:
        resolution:
          type: string
          description: 分辨率档位（如 1K / 2K）。
        ratio:
          type: string
          description: 宽高比（如 9:16）。
        width:
          type: integer
          description: 输出宽度（像素）。
          minimum: 1
        height:
          type: integer
          description: 输出高度（像素）。
          minimum: 1
    CapabilityMode:
      type: object
      required:
        - id
        - reference_material
      description: 一个可提交媒体模式及其参考素材边界。
      properties:
        id:
          type: string
          enum:
            - text-to-image
            - reference-image
            - text-to-video
            - first-frame
            - first-last-frame
            - omni-reference
        reference_material:
          $ref: "#/components/schemas/ReferenceMaterialPolicy"
    ReferenceMaterialPolicy:
      type: object
      required:
        - total
      description: |-
        参考素材边界：total 是跨媒体种类总数；per_media 按种类给出
        数量、格式与包络。图片参考为有序列表（顺序即语义）。
      properties:
        total:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        per_media:
          type: object
          nullable: true
          properties:
            image:
              $ref: "#/components/schemas/ImageReferenceEnvelope"
            video:
              $ref: "#/components/schemas/VideoReferenceEnvelope"
            audio:
              $ref: "#/components/schemas/AudioReferenceEnvelope"
    ImageReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_px
        - max_px
        - max_pixels
        - min_aspect
        - max_aspect
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_px:
          type: integer
          description: 单边最小像素。
        max_px:
          type: integer
          description: 单边最大像素。
        max_pixels:
          type: integer
          description: 单图最大像素总数。
        min_aspect:
          type: number
          description: 宽高比下界（如 1/3）。
        max_aspect:
          type: number
          description: 宽高比上界（如 3/1）。
    VideoReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_seconds
        - max_seconds
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_seconds:
          type: integer
        max_seconds:
          type: integer
    AudioReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_seconds
        - max_seconds
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_seconds:
          type: integer
        max_seconds:
          type: integer
    TaskRetryInput:
      type: object
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    GenerationTask:
      type: object
      required:
        - id
        - session_id
        - status
        - media_type
        - slot_count
        - cancel_requested
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - submitting
            - processing
            - persisting
            - cancelling
            - succeeded
            - partially_succeeded
            - failed
            - cancelled
            - timed_out
          description: 单向状态机；终态永不重开，内部 retry 不回 queued。
        media_type:
          type: string
          enum: [image, video]
        slot_count:
          type: integer
          minimum: 1
          maximum: 4
        cancel_requested:
          type: boolean
          description: 取消是 best effort —— 已接受的外部工作继续权威收敛，已取得输出保留。
        terminal_cause:
          type: string
          nullable: true
          enum: [provider_outcome_indeterminate]
          description: 零成功且含 indeterminate 槽位时的内部原因；对外映射 processing_indeterminate。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: >-
            Generation Task 详情变化判据。Server 保留 PostgreSQL 微秒精度；每次已提交且会改变
            task 状态、取消事实、slot verdict、失败诊断或结果事实的写入都会严格推进该值。
            列表摘要与详情使用相同语义；消费者按完整原始字符串比较，不得先降精度再判断未变化。
        terminal_at:
          type: string
          format: date-time
          nullable: true
        snapshot:
          description: >-
            提交时刻冻结的创建意图快照（与详情 specification 同源同形状）；可空——
            无快照的载荷由消费方回退为任务自带数据（状态/媒体类型/槽位）。
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GenerationSpecification"
    GenerationFailureDiagnostic:
      type: object
      description: >-
        创建者私有的具体失败诊断。provider 来源保留 Kapon 标准错误 envelope
        中经过本次调用凭据/敏感输入与 URL 脱敏、控制字符清理及长度限制的字段；
        其他来源由 Server 在下载、存储或媒体探测的权威失败点生成。不会包含 Provider Key、Authorization header、
        prompt、参考素材、输出 URL 或任意原始响应体；该对象只解释 failure_reason，
        不参与重试、治理或状态机判断。
      required:
        - source
        - code
        - message
        - http_status
        - provider_type
        - request_id
      properties:
        source:
          type: string
          enum: [provider, output_transfer, storage, media_probe]
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2000
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          nullable: true
        provider_type:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
        request_id:
          type: string
          minLength: 1
          maxLength: 256
          nullable: true
    GenerationSlot:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 3
        status:
          type: string
          enum:
            - queued
            - generating
            - persisting
            - cancelling
            - succeeded
            - failed
            - cancelled
            - timed_out
            - indeterminate
          description: queued/generating/persisting/cancelling 是 task/job/queue 的派生投影；后五者为写入一次的槽位终态。
        failure_reason:
          type: string
          nullable: true
          enum:
            - invalid_input
            - rights_confirmation_required
            - input_policy_rejected
            - output_policy_rejected
            - action_required
            - temporarily_unavailable
            - provider_route_unavailable
            - processing_indeterminate
            - internal_error
          description: 稳定失败 taxonomy；provider_route_unavailable 是 Server 对白名单模型渠道错误的归一化诊断；部分成功逐槽位显示 reason。具体诊断（若可获得）由 failure_diagnostic 携带。
        failure_diagnostic:
          allOf:
            - $ref: "#/components/schemas/GenerationFailureDiagnostic"
          nullable: true
        result:
          type: object
          nullable: true
          description: 仅成功槽位携带；输出已转存自有 Storage 并通过验证。
          required:
            - mime_type
            - byte_size
            - checksum_sha256
          properties:
            mime_type:
              type: string
            byte_size:
              type: integer
              format: int64
            checksum_sha256:
              type: string
              description: 转存时计算并验证的 SHA-256（hex）。
            width_px:
              type: integer
            height_px:
              type: integer
            duration_ms:
              type: integer
    GenerationTaskDetail:
      type: object
      required:
        - task
        - slots
      properties:
        task:
          $ref: "#/components/schemas/GenerationTask"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/GenerationSlot"
        specification:
          description: 创建者私有的冻结 Generation Specification（仅详情返回）。
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GenerationSpecification"
    GenerationSpecification:
      type: object
      required:
        - schema_version
        - media_type
        - prompt
        - model
        - mode
        - manifest_version
        - quantity
        - references
      properties:
        schema_version:
          type: integer
        media_type:
          type: string
          enum: [image, video]
        prompt:
          type: string
        model:
          type: string
        mode:
          type: string
        manifest_version:
          type: integer
        ratio:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        quantity:
          type: integer
        duration_seconds:
          type: integer
          nullable: true
        references:
          type: array
          items:
            type: object
            required: [material_id, role, kind, claims_version]
            properties:
              material_id:
                type: string
                format: uuid
              role:
                type: string
              kind:
                type: string
                enum: [image, video, audio]
              claims_version:
                type: integer
    GenerationTaskList:
      type: object
      required:
        - tasks
        - next_cursor
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/GenerationTask"
        next_cursor:
          type: string
          nullable: true
    GovernanceLimits:
      type: object
      description: 四个可选上限；null/缺省 = 未设置（不限），显式 0 = 禁止相应范围新 Task。
      properties:
        image_concurrency:
          type: integer
          nullable: true
          minimum: 0
        video_concurrency:
          type: integer
          nullable: true
          minimum: 0
        rate_limit:
          type: integer
          nullable: true
          minimum: 0
          description: 滚动 60 秒内结构有效提交尝试上限（跨媒体）。
        monthly_task_limit:
          type: integer
          nullable: true
          minimum: 0
          description: Asia/Shanghai 自然月已准入 Task 上限（跨媒体）。
    GovernanceUserEntry:
      type: object
      required: [user_id, limits]
      properties:
        user_id:
          type: string
          format: uuid
        limits:
          $ref: "#/components/schemas/GovernanceLimits"
    GenerationGovernanceView:
      type: object
      required: [instance, users]
      properties:
        instance:
          $ref: "#/components/schemas/GovernanceLimits"
        users:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceUserEntry"
