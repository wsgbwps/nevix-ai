# Creation Module API contract. The OpenAPI master references each Path Item here.
#
# 可见性基线（ADR-0016）：Creation Session 与 Reference Material 是 creator-private —— 只有创建者
# 能读写自己的会话与素材；其他 Member 或 Admin 即使猜测 id 也得到与不存在完全一致的 404 not_found，
# 不能读取 prompt、素材或私有媒体。本切片（AI Creation V1 06/16）不提供任何 Admin 治理路由。
#
# 文件流纪律（ADR-0014）：上传与下载一律经 Go 有界流式传输；Desktop 不获得 Storage 凭据或直传授权。
paths:
  /creation/sessions:
    post:
      operationId: createSession
      summary: 创建私有 Creation Session
      description: |-
        为当前创建者原子创建一个空的私有 Creation Session（草稿）。name 可选：省略或空白时存为空串，
        界面以本地化「未命名创作」兜底展示。成功即返回完整会话资源；失败不留任何半成品。
        该动作不创建 Generation Task、Provider Job 或任何计费事实。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 128
                  description: 会话名；去首尾空白后存储，最长 128 字符。
      responses:
        "201":
          description: 会话已创建并立即可继续。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSessions
      summary: 列出当前创建者的活跃 Creation Session
      description: |-
        只返回当前创建者自己的、未被逻辑删除的 Session，按 (created_at DESC, id DESC) 复合键序分页。
        其他 Member 的会话永不出现。复合 cursor 是包含全部排序键的不透明 token；
        next_cursor 为 null 表示没有下一页。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/keysetCursor"
      responses:
        "200":
          description: 当前页会话与下一页 cursor。
          content:
            application/json:
              schema:
                type: object
                required:
                  - sessions
                  - next_cursor
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreationSession"
                  next_cursor:
                    type: string
                    nullable: true
                    description: 继续向后翻页的复合 keyset cursor；null 表示已是最后一页。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}:
    get:
      operationId: getSession
      summary: 读取当前创建者的单个 Session
      description: |-
        选择（继续创作）入口：只对创建者可见；不存在、他人所有或已逻辑删除一律 404 not_found。
        已删除会话不因重新 GET 而复活。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "200":
          description: 会话资源。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameSession
      summary: 重命名当前创建者的 Session
      description: |-
        继续创作的轻量编辑：只有创建者可以重命名；目标不存在、他人所有或已删除一律 404。
        改名是幂等的普通写命令，不产生生成或计费事实。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: 新名字；去首尾空白后必须非空。
      responses:
        "200":
          description: 改名后的会话资源。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSession
      summary: 逻辑删除当前创建者的 Session
      description: |-
        删除立即从列表与选择路径隐藏会话，并阻止后续一切生成入口；保留既有记录用于追溯，
        成功形成的媒体资产的生命周期独立于会话。重复 DELETE 视为目标已消失，回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "204":
          description: 会话已逻辑删除且不再出现。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/sessions/{sessionID}/materials:
    get:
      operationId: listSessionMaterials
      summary: 列出会话内的 Reference Material
      description: |-
        牌堆数据源：只返回创建者自己该会话下的素材，按 (created_at ASC, id ASC) 复合键序分页
        （牌堆顺序 = 上传顺序）。目标会话不存在、他人所有或已删除回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/keysetCursor"
      responses:
        "200":
          description: 当前页素材与下一页 cursor。
          content:
            application/json:
              schema:
                type: object
                required:
                  - materials
                  - next_cursor
                properties:
                  materials:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferenceMaterial"
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: uploadReferenceMaterial
      summary: 上传 Reference Material 并原子记录权利声明
      description: |-
        唯一 V1 入料动作：multipart/form-data 单一 file part。上传动作本身即为权利确认——
        actor、时间、声明版本与素材 identity 在同一可信命令中原子落库；写库失败则素材完全不可用，
        blob 一并清理。服务端权威验证 MIME、扩展名、大小、实际尺寸、像素数、时长与可读性；
        客户端校验只用于即时反馈。声明版本升级不影响既有素材（不追溯阻塞）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 素材文件本体；filename 必填（≤255 字符），part 的 Content-Type 仅作提示，服务端按内容嗅探定论。
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp, video/mp4, audio/mpeg, audio/x-wav, audio/mp4
      responses:
        "201":
          description: 素材已入库并可立即在牌堆使用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceMaterial"
        "400":
          description: 请求不合法 —— invalid_request 指缺失 file part / 多余字段 / filename 违规；upload_malformed 指 multipart 结构损坏或在传输中被截断。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      error:
                        enum:
                          - invalid_request
                          - upload_malformed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/MaterialTooLarge"
        "415":
          $ref: "#/components/responses/MaterialUnsupportedMedia"
        "422":
          $ref: "#/components/responses/MaterialUnreadableMedia"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/materials/{materialID}:
    get:
      operationId: downloadReferenceMaterial
      summary: 流式下载参考素材文件
      description: |-
        经 Go 有界流式出口取回素材本体；支持单区间 Range 请求（206 + Content-Range），
        不支持多区间与非法区间（416）。响应携带 X-Content-SHA-256：全量下发时服务端在下发
        过程中即时校验 checksum，不一致将中断连接而非下发损坏数据；部分（206）下发无法从
        全文 digest 反推区间校验，客户端可凭该头部自行核对。仅创建者可读；他人/Admin 猜测 id
        得到 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/materialID"
        - name: Range
          in: header
          required: false
          description: 标准单区间字节范围（bytes=start-end | bytes=start- | bytes=-suffix）。
          schema:
            type: string
      responses:
        "200":
          description: 完整文件流，Content-Type 为素材的服务端定论 MIME。
          headers:
            Content-Length:
              description: 完整字节数。
              schema:
                type: integer
            X-Content-SHA-256:
              description: 全文件 SHA-256 十六进制摘要。
              schema:
                type: string
            Accept-Ranges:
              description: 固定为 bytes。
              schema:
                type: string
                enum:
                  - bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: 单区间部分内容，带 Content-Range 与 X-Content-SHA-256。
          headers:
            Content-Range:
              description: 实际下发区间（bytes start-end/total）。
              schema:
                type: string
            X-Content-SHA-256:
              description: 全文件 SHA-256 十六进制摘要。
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteReferenceMaterial
      summary: 删除当前创建者的 Reference Material
      description: 删除素材记录及其 blob：仅创建者可删；行删除事务成功后再清理 blob。他人/已删除回答 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/materialID"
      responses:
        "204":
          description: 素材记录已删除；blob 清理随 AfterCommit 执行。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/provider-connection:
    get:
      operationId: getProviderConnection
      summary: 查看实例唯一 AI Provider Connection（脱敏）
      description: |-
        Admin 治理视图：只返回管理状态、凭据状态、图片/视频独立 capability 与时间戳；
        不返回 Provider Key、Endpoint、模型 ID、供应商 request ID 或原始错误。实例尚无
        active Connection 时回答 404 provider_connection_not_configured。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前 active Connection 的脱敏治理视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: configureProviderConnection
      summary: 首次配置 Kapon Provider Connection
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.create）后，以候选
        Provider Key 执行一次 Connection Check（固定国内 Kapon 路由的 GET /v1/models，不生成
        真实媒体）。候选无效或临时不可用时丢弃候选且不落任何连接事实（Proof 已消费，不恢复）；
        通过则在主密钥 AEAD 保护下原子写入唯一 active Connection。每个实例最多一个 active
        Connection（数据库单例约束）。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionCredentialInput"
      responses:
        "201":
          description: Connection 已建立并返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionConfigureRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ProviderConnectionConfigureConflict"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProviderCheckTemporarilyUnavailable"
    patch:
      operationId: updateProviderConnectionAdminState
      summary: 暂停或恢复 Connection
      description: |-
        只需有效 Admin Session（不消费 Proof）：enabled 允许后续新任务，paused 阻止新任务
        与尚未开始的 Provider 调用；已接受的外部工作继续收敛。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_state
              properties:
                admin_state:
                  type: string
                  enum:
                    - enabled
                    - paused
            description: 目标管理状态。
      responses:
        "200":
          description: 管理状态已更新并返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProviderConnection
      summary: 删除（终止）Connection
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.delete）后终止当前
        Connection：清除 Encrypted Provider Credential、释放「最多一个 active Connection」
        约束，但保留供既有事实与 Audit Log 追溯的非敏感历史 identity；此后重新配置产生新的
        Connection identity，不复活旧聚合。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  description: exact-action Reauthentication Proof（provider_connection.delete）。
      responses:
        "200":
          description: Connection 已终止；返回终止时的脱敏视图（密文已清除）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionDeleteRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "409":
          $ref: "#/components/responses/ReauthProofActionMismatch"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/provider-connection/credential:
    put:
      operationId: replaceProviderConnectionCredential
      summary: 替换 Provider Key（候选先行）
      description: |-
        消费 exact-action Reauthentication Proof（provider_connection.replace）后，以候选
        Provider Key 完成 Connection Check。候选失败即丢弃：旧密文与能力保持原样（Proof 已
        消费，不恢复）；候选通过则原子切换密文与状态 —— 即使只看到一个媒体的模型也可切换，
        另一媒体独立置为 unavailable。主密钥不可用时本命令同时是恢复通道：先安全建立新主密钥
        文件，再写入新密文。请求必须经已证明的 HTTPS 传输。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionCredentialInput"
      responses:
        "200":
          description: 候选已切换为当前凭据；返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "400":
          $ref: "#/components/responses/ProviderConnectionReplaceRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "409":
          $ref: "#/components/responses/ReauthProofActionMismatch"
        "410":
          $ref: "#/components/responses/ReauthProofExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProviderCheckTemporarilyUnavailable"
  /creation/provider-connection/recheck:
    post:
      operationId: recheckProviderConnection
      summary: 手动重检 Connection
      description: |-
        只需有效 Admin Session（不消费 Proof）。解密当前凭据并重新执行 Connection Check：
        临时故障（超时/429/5xx）不改写既有状态，只在视图中记录 temporarily_unavailable；
        主密钥不可用则置 credential_unavailable 并 fail closed，绝不静默重建主密钥。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 重检完成（或因临时故障保持原状态）；返回脱敏视图。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProviderConnectionNotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/media-capabilities:
    get:
      operationId: listMediaCapabilities
      summary: 按媒体归一化的能力可用性（Member surface）
      description: |-
        全体 active User 可读：只返回图片/视频各自的可用性、稳定原因与行动建议；
        不泄露 Endpoint、模型 ID、凭据细节、诊断或 Provider payload。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 分媒体能力状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /creation/capability-manifest:
    get:
      operationId: getCapabilityManifest
      summary: 版本化 AI Provider Capability Manifest（Workbench 只镜像此处允许值）
      description: |-
        全体 active User 可读；Admin 与 Member 收到完全相同的 payload。
        Server 权威发布当前**可提交**的模型、媒体模式、比例、分辨率、数量/时长与
        参考素材上限（schema_version 标识载荷形状，manifest_version 标识能力内容版本）。
        每媒体 available=false 时只携带稳定 reason 与行动建议，值集合省略 ——
        下游 Workbench 据此保留失效草稿原值并阻止提交，无需猜测 Provider 状态。
        Nevix 全局 Production Readiness（发布级真实 smoke 门槛）与实例 Connection 检查
        在此正交合并：Readiness 未通过的媒体一律 production_readiness_pending，
        且绝不改写实例 Connection/Credential/Capability 检查事实。
        固定国内 Endpoint 与模型 allowlist 不由 Desktop 配置；无第二连接或 fallback。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前权威 Capability Manifest；只含当前可提交值。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    sessionID:
      name: sessionID
      in: path
      required: true
      description: 目标 Creation Session id（UUID）。
      schema:
        type: string
        format: uuid
    materialID:
      name: materialID
      in: path
      required: true
      description: 目标 Reference Material id（UUID）。
      schema:
        type: string
        format: uuid
    pageLimit:
      name: limit
      in: query
      required: false
      description: 页大小，1..200，默认 50。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    keysetCursor:
      name: cursor
      in: query
      required: false
      description: 上页 next_cursor 原样回传的复合 keyset 令牌；缺省从首页开始。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求不合法 —— invalid_request 指请求体不是约定形状的 JSON 或字段边界违规；invalid_cursor 指 cursor 不是合法的复合分页令牌。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - invalid_cursor
    Unauthorized:
      description: 未认证 —— 缺失、无效、过期或已吊销的 session token。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - unauthorized
    NotFound:
      description: |-
        not_found —— 目标不存在、不属于当前创建者、已被逻辑删除，或路径 id 本身不是合法 UUID；
        四者不可区分（防枚举与防格式探测），样式与 /identity 各目标路由一致。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - not_found
    MaterialTooLarge:
      description: material_too_large —— 上传体积超过该媒体类别的上限（image 10 MiB、audio 50 MiB、video 200 MiB）；超限流被服务端中断。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_too_large
    MaterialUnsupportedMedia:
      description: material_unsupported_media —— 内容嗅探出的媒体类别不在 image/video/audio 白名单内，或扩展名与内容类别不一致。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_unsupported_media
    MaterialUnreadableMedia:
      description: material_unreadable_media —— 结构可识别但无法权威解码（尺寸/像素/时长探测失败），素材不会被入库。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - material_unreadable_media
    RangeNotSatisfiable:
      description: 非法或不可满足的 Range（多区间、语法错误、start 越过 EOF）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - range_not_satisfiable
    Forbidden:
      description: forbidden —— 认证有效但该命令要求 Admin 角色（ADR-0015 guard 词汇）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - forbidden
    ProviderConnectionNotConfigured:
      description: provider_connection_not_configured —— 实例尚无 active AI Provider Connection。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_connection_not_configured
    ProviderConnectionConfigureRejected:
      description: |-
        首次配置被拒绝 —— invalid_request（形状/字段边界）、secure_transport_required（未证明
        HTTPS）、reauth_proof_invalid（Proof 未知或不属于该 Admin）、provider_credential_invalid
        （候选 Key 被固定国内 Kapon 路由的 /v1/models 判定无效；候选被丢弃，无连接事实落库）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
                      - provider_credential_invalid
    ProviderConnectionConfigureConflict:
      description: |-
        409 —— provider_connection_exists（实例已有 active Connection，单例约束）；
        reauth_proof_action_mismatch（Proof 绑定其他 action）；reauth_proof_already_consumed
        （Proof 单次消费已用掉，不恢复）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_connection_exists
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
    ProviderConnectionReplaceRejected:
      description: |-
        替换被拒绝且旧凭据/能力保持原样 —— invalid_request、secure_transport_required、
        reauth_proof_invalid、provider_credential_invalid（候选被丢弃）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
                      - provider_credential_invalid
    ProviderConnectionDeleteRejected:
      description: |-
        删除被拒绝 —— invalid_request、secure_transport_required、reauth_proof_invalid。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - invalid_request
                      - secure_transport_required
                      - reauth_proof_invalid
    ReauthProofActionMismatch:
      description: |-
        409 —— reauth_proof_action_mismatch（Proof 绑定其他 action，仍可用于其自身 action）；
        reauth_proof_already_consumed（单次消费已发生，不恢复）。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reauth_proof_action_mismatch
                      - reauth_proof_already_consumed
    ReauthProofExpired:
      description: reauth_proof_expired —— 五分钟有效期已过。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - reauth_proof_expired
    ProviderCheckTemporarilyUnavailable:
      description: |-
        provider_check_temporarily_unavailable —— 固定国内 Kapon 路由对 /v1/models 的检查
        遇到超时、429 或临时 5xx：候选被丢弃、既有状态不被永久改写，稍后重试。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - provider_check_temporarily_unavailable
    InternalError:
      description: 服务端内部错误，动作未完成。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  error:
                    enum:
                      - internal_error
  schemas:
    Error:
      $ref: "./openapi.yaml#/components/schemas/Error"
    CreationSession:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 会话名；允许空串（界面以本地化「未命名创作」兜底）。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReferenceMaterial:
      type: object
      required:
        - id
        - kind
        - file_name
        - mime_type
        - byte_size
        - checksum_sha256
        - claims_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - image
            - video
            - audio
        file_name:
          type: string
          maxLength: 255
          description: 上传时声明的原始文件名，仅供创建者本人展示。
        mime_type:
          type: string
          description: 服务端嗅探定论的 MIME（权威）。
        byte_size:
          type: integer
          minimum: 1
        width_px:
          type: integer
          nullable: true
          description: 图像/视频实际像素宽；音频为 null。
        height_px:
          type: integer
          nullable: true
          description: 图像/视频实际像素高；音频为 null。
        pixel_count:
          type: integer
          nullable: true
          description: 图像总像素数；其余为 null。
        duration_ms:
          type: integer
          nullable: true
          description: 音频/视频实际时长（毫秒）；图像为 null。
        checksum_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 全文件 SHA-256 十六进制摘要。
        claims_version:
          type: integer
          minimum: 1
          description: 上传动作确认的权利声明版本；升级只作用于以后新建的素材，不追溯阻塞既有素材。
        created_at:
          type: string
          format: date-time
    ProviderConnectionCredentialInput:
      type: object
      required:
        - proof
        - provider_key
      properties:
        proof:
          type: string
          description: exact-action Reauthentication Proof（create 或 replace 视命令而定）。
        provider_key:
          type: string
          minLength: 1
          maxLength: 4096
          description: 候选 Kapon Provider Key；只在服务端检查/加密期间短暂存在，永不回显。
    ProviderConnection:
      type: object
      required:
        - id
        - admin_state
        - credential_state
        - image_capability
        - video_capability
        - created_at
        - updated_at
        - needs_attention
      properties:
        id:
          type: string
          format: uuid
        admin_state:
          type: string
          enum:
            - enabled
            - paused
        credential_state:
          type: string
          enum:
            - checking
            - valid
            - invalid
            - credential_unavailable
        image_capability:
          type: string
          enum:
            - checking
            - available
            - unavailable
        video_capability:
          type: string
          enum:
            - checking
            - available
            - unavailable
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次 Connection Check 的时间（包括以 temporarily_unavailable 结束的尝试）；从未检查为 null。
        last_check_outcome:
          type: string
          nullable: true
          enum:
            - completed
            - temporarily_unavailable
          description: 最近一次检查的结局；临时故障不永久改写既有状态。
        needs_attention:
          type: boolean
          description: 派生提示（非持久状态）：凭据无效/不可用、暂停或任一媒体不可用时为 true。
    MediaCapabilities:
      type: object
      required:
        - image
        - video
      properties:
        image:
          $ref: "#/components/schemas/MediaCapabilityStatus"
        video:
          $ref: "#/components/schemas/MediaCapabilityStatus"
    MediaCapabilityStatus:
      type: object
      required:
        - status
        - reason
        - action
      properties:
        status:
          type: string
          enum:
            - checking
            - available
            - unavailable
        reason:
          type: string
          nullable: true
          enum:
            - not_configured
            - connection_paused
            - credential_invalid
            - credential_unavailable
            - model_unavailable
            - checking
          description: 不可用/检查中的稳定机器原因；可用时为 null。
        action:
          type: string
          nullable: true
          enum:
            - wait
            - contact_admin
          description: 稳定行动建议；可用时为 null。
    CapabilityManifest:
      type: object
      required:
        - schema_version
        - manifest_version
        - image
        - video
      properties:
        schema_version:
          type: integer
          enum:
            - 1
          description: 载荷形状版本；字段结构变化时递增。
        manifest_version:
          type: integer
          description: 能力内容版本；已验收能力集合变化（扩张或经决策移除）时递增。
          minimum: 1
        image:
          $ref: "#/components/schemas/CapabilityMedia"
        video:
          $ref: "#/components/schemas/CapabilityMedia"
    CapabilityMedia:
      type: object
      required:
        - available
      description: |-
        一个媒体的当前可提交能力。available=false 时必带稳定 reason 与行动建议
        （结构化字段），且值集合全部省略 —— 消费方据此保留失效草稿原值并阻止提交；
        available=true 时 reason/action 省略，值集合齐全。
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
            - production_readiness_pending
            - not_configured
            - checking
            - credential_invalid
            - credential_unavailable
            - connection_paused
            - model_unavailable
          description: 不可用/检查中的稳定机器原因；可用时省略。production_readiness_pending 表示 Nevix 全局发布门槛未通过，实例侧无法修复。
        action:
          type: string
          nullable: true
          enum:
            - wait
            - await_release
            - contact_admin
          description: 稳定行动建议；可用时省略。await_release 表示等待 Nevix 发布级验收，实例 Admin 无法就地修复。
        model:
          type: string
          nullable: true
          description: 该媒体已验收的唯一 allowlist 模型；可用时非空。
        modes:
          type: array
          nullable: true
          description: 当前可提交的媒体模式（固定顺序）；可用时非空。
          items:
            $ref: "#/components/schemas/CapabilityMode"
        ratios:
          type: array
          nullable: true
          description: 图片可提交比例（固定顺序，来自已验收 supported ratios）；仅 image 且可用时非空。
          items:
            type: string
            enum:
              - "1:1"
              - "4:3"
              - "4:5"
              - "16:9"
              - "9:16"
        resolutions:
          type: array
          nullable: true
          description: 可提交分辨率（固定顺序）；可用时非空。图片为 1K/2K/4K，视频为 480p/720p/1080p。
          items:
            type: string
        quantities:
          type: array
          nullable: true
          description: 图片可提交数量（升序 1..4）；仅 image 且可用时非空。
          items:
            type: integer
            minimum: 1
            maximum: 4
        durations:
          type: array
          nullable: true
          description: 视频可提交时长（秒，升序）；仅 video 且可用时非空。
          items:
            type: integer
            minimum: 1
        defaults:
          type: object
          nullable: true
          description: 每维度的推荐默认值；均属当前已发布集合。可用时非空。
          required:
            - resolution
          properties:
            ratio:
              type: string
            resolution:
              type: string
            quantity:
              type: integer
            duration:
              type: integer
        prompt:
          type: object
          nullable: true
          description: prompt 长度包络（Unicode 字符）；可用时非空。
          required:
            - min_chars
            - max_chars
          properties:
            min_chars:
              type: integer
            max_chars:
              type: integer
        reference_material:
          nullable: true
          description: 参考素材总包络（跨模式最宽边界）；逐模式边界见 CapabilityMode。可用时非空。
          $ref: "#/components/schemas/ReferenceMaterialPolicy"
    CapabilityMode:
      type: object
      required:
        - id
        - reference_material
      description: 一个可提交媒体模式及其参考素材边界。
      properties:
        id:
          type: string
          enum:
            - text-to-image
            - reference-image
            - text-to-video
            - first-frame
            - first-last-frame
            - omni-reference
        reference_material:
          $ref: "#/components/schemas/ReferenceMaterialPolicy"
    ReferenceMaterialPolicy:
      type: object
      required:
        - total
      description: |-
        参考素材边界：total 是跨媒体种类总数；per_media 按种类给出
        数量、格式与包络。图片参考为有序列表（顺序即语义）。
      properties:
        total:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        per_media:
          type: object
          nullable: true
          properties:
            image:
              $ref: "#/components/schemas/ImageReferenceEnvelope"
            video:
              $ref: "#/components/schemas/VideoReferenceEnvelope"
            audio:
              $ref: "#/components/schemas/AudioReferenceEnvelope"
    ImageReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_px
        - max_px
        - max_pixels
        - min_aspect
        - max_aspect
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_px:
          type: integer
          description: 单边最小像素。
        max_px:
          type: integer
          description: 单边最大像素。
        max_pixels:
          type: integer
          description: 单图最大像素总数。
        min_aspect:
          type: number
          description: 宽高比下界（如 1/3）。
        max_aspect:
          type: number
          description: 宽高比上界（如 3/1）。
    VideoReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_seconds
        - max_seconds
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_seconds:
          type: integer
        max_seconds:
          type: integer
    AudioReferenceEnvelope:
      type: object
      required:
        - count
        - formats
        - max_bytes
        - min_seconds
        - max_seconds
      properties:
        count:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        formats:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
        min_seconds:
          type: integer
        max_seconds:
          type: integer
