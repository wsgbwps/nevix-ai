appId: com.electron.app
productName: Nevix AI
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: build/locales
    to: .
asarUnpack:
  - resources/**
win:
  executableName: Nevix AI
nsis:
  artifactName: Nevix-AI-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerLanguages:
    - en_US
    - zh_CN
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Nevix AI requests access to your camera.
    NSMicrophoneUsageDescription: Nevix AI requests access to your microphone.
    NSDocumentsFolderUsageDescription: Nevix AI requests access to your Documents folder.
    NSDownloadsFolderUsageDescription: Nevix AI requests access to your Downloads folder.
  notarize: false
dmg:
  artifactName: Nevix-AI-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: Nevix-AI-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
