appId: com.nevix.ai
productName: Nevix AI
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'package.json'
  - 'resources/icon.png'
  - '!**/*.{map,ts,tsx,mts,cts,p12,pfx,pem,key}'
  - '!**/.env*'
  - '!**/.git/**'
  - '!**/README*.md'
  - '!**/node_modules/@dotenvx/dotenvx/src/cli/examples.js'
  - '!**/node_modules/source-map/dist/source-map.debug.js'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.ts'
  - '!playwright.config.ts'
  - '!components.json'
  - '!scripts/**'
  - '!tests/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: build/locales
    to: .
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Nevix AI
nsis:
  artifactName: Nevix-AI-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerLanguages:
    - en_US
    - zh_CN
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  extendInfo:
    NSCameraUsageDescription: Nevix AI requests access to your camera.
    NSMicrophoneUsageDescription: Nevix AI requests access to your microphone.
    NSDocumentsFolderUsageDescription: Nevix AI requests access to your Documents folder.
    NSDownloadsFolderUsageDescription: Nevix AI requests access to your Downloads folder.
  notarize: false
dmg:
  artifactName: Nevix-AI-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://cnb.cool/nevix.ai/nevix-releases/-/git/raw/main/stable/
  useMultipleRangeRequest: false
