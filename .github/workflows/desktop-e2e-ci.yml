name: Desktop E2E CI

on:
  workflow_dispatch:
    inputs:
      inject_identity_server_failure:
        description: Retain a sanitized identity server log by failing a representative E2E.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      suite:
        description: The E2E suite to run for the calling workflow.
        required: true
        type: string
      inject_identity_server_failure:
        description: Fail a representative E2E to validate the shared failure artifact.
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-policy:
    name: Supabase Auth Policy Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/supabase-image-cache
        id: supabase-images
        with:
          phase: restore
      - run: pnpm test:auth-policy
      - uses: ./.github/actions/supabase-image-cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        with:
          phase: save
      - name: Tear down Auth policy stack
        if: always()
        run: |
          docker rm --force \
            supabase_auth_nevix-auth-policy \
            nevix_auth_policy_hibp_fixture \
            2>/dev/null || true
          pnpm exec supabase stop --project-id nevix-auth-policy --no-backup || true

  e2e-smoke:
    name: E2E Smoke Suite
    if: inputs.suite == 'smoke'
    # Pinned runner image so an unannounced runner switch cannot change the stack.
    runs-on: ubuntu-24.04
    # #72's image-cache save (docker save of the whole stack) runs as a post-step
    # after the suite; 10m cut the job mid-snapshot and reported an all-green
    # suite as cancelled. Budget the save phase explicitly.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install Electron runtime dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64
          libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnss3 xvfb
      - run: pnpm install --frozen-lockfile
      - name: Run the E2E Smoke Suite
        # Linux runners only offer the basic_text safeStorage backend; force it so the
        # Session persistence paths execute instead of skipping.
        run: xvfb-run -a pnpm --filter @nevix/desktop test:e2e:smoke
        env:
          NEVIX_TEST_FORCE_BASIC_TEXT_STORAGE: "1"
          NEVIX_TEST_INJECT_IDENTITY_SERVER_FAILURE: ${{ inputs.inject_identity_server_failure && 'after-renderer-launch' || '' }}
      # The Electron helper and E2E runner share this owner for Desktop diagnostics and the
      # bounded, sanitized identity server log. The runner finalizes the log before cleanup.
      - name: Verify E2E failure artifacts contain no credentials
        id: verify-smoke-failure-artifacts
        if: failure()
        run: pnpm --filter @nevix/desktop verify:auth-artifacts
      - name: Upload E2E failure artifacts
        if: failure() && steps.verify-smoke-failure-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-full:
    name: Full E2E Suite
    if: inputs.suite != 'smoke'
    # Pinned runner image so an unannounced runner switch cannot change the stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install Electron runtime dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64
          libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnss3 xvfb
      - run: pnpm install --frozen-lockfile
      - name: Run the Full E2E Suite
        # Linux runners only offer the basic_text safeStorage backend; force it so the
        # Session persistence paths execute instead of skipping.
        run: xvfb-run -a pnpm --filter @nevix/desktop test:e2e
        env:
          NEVIX_TEST_FORCE_BASIC_TEXT_STORAGE: "1"
          NEVIX_TEST_INJECT_IDENTITY_SERVER_FAILURE: ${{ inputs.inject_identity_server_failure && 'after-renderer-launch' || '' }}
      # The Electron helper and E2E runner share this owner for Desktop diagnostics and the
      # bounded, sanitized identity server log. The runner finalizes the log before cleanup.
      - name: Verify E2E failure artifacts contain no credentials
        id: verify-full-failure-artifacts
        if: failure()
        run: pnpm --filter @nevix/desktop verify:auth-artifacts
      - name: Upload E2E failure artifacts
        if: failure() && steps.verify-full-failure-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore
