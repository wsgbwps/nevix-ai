name: Server CI

on:
  workflow_call:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Vet, test, and integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test
        working-directory: server
        run: go test ./...
      # Pure-PostgreSQL integration suite (no Supabase stack): the harness
      # starts one pinned throwaway postgres container and runs the identity
      # tree against it with zero skips.
      - name: Identity integration (real PostgreSQL)
        run: ./scripts/test-identity-integration.sh
      # Creation Module integration (#156): pinned postgres + MinIO, the real
      # Module contract over HTTP, storage conformance on both adapters, and
      # the short file-stream smoke — zero skips enforced by the harness.
      - name: Creation integration (real PostgreSQL + MinIO)
        run: ./scripts/test-creation-integration.sh
