name: Server CI

on:
  workflow_call:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, and integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format
        working-directory: server
        run: |
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "$unformatted" ]]; then
            printf 'error: gofmt required:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test
        working-directory: server
        run: go test ./...
      # Pure-PostgreSQL integration suite (no Supabase stack): the harness
      # starts one pinned throwaway postgres container and runs the identity
      # tree against it with zero skips.
      - name: Identity integration (real PostgreSQL)
        run: ./scripts/test-identity-integration.sh
      # Creation Module integration (#222): pinned Postgres, real HTTP Module
      # behavior over injected fakes, and retained MinIO conformance. Fakes and
      # MinIO are test-only, never production runtime options; zero skips.
      - name: Creation integration (real PostgreSQL + test-only MinIO)
        run: ./scripts/test-creation-integration.sh

  offline-runtime:
    name: Offline Linux x64 (${{ matrix.store }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Use OCI image store for vendor export
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
          docker compose version
      - name: First install from empty cache with registry networking absent
        env:
          NEVIX_DEPLOY_TEST_STORE: ${{ matrix.store }}
        run: make test-offline-runtime
