name: Desktop CI

on:
  push:
    tags:
      - "v*"
  workflow_call:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit test
    runs-on: ubuntu-latest
    # Unbounded external downloads (Playwright CDN) have hung this job for
    # 25+ minutes in practice; cap it so a hang fails fast instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Cache the Playwright browser so `playwright install` is a no-op on hit;
      # a cold CDN download is the known hang point of this job.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop lint
      - run: pnpm --filter @nevix/desktop verify:architecture
      - run: pnpm --filter @nevix/desktop test:unit
      - run: pnpm --filter @nevix/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @nevix/desktop test:component

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop build

  package:
    name: Package (${{ matrix.os }})
    needs: [quality, build]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop ${{ matrix.script }}
