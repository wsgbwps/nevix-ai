name: Desktop CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_call:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop lint
      - run: pnpm --filter @nevix/desktop verify:architecture
      - run: pnpm --filter @nevix/desktop test:unit
      - run: pnpm --filter @nevix/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @nevix/desktop test:component

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop build

  package:
    name: Package (${{ matrix.os }})
    needs: [quality, build]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop ${{ matrix.script }}
        env:
          VITE_SUPABASE_URL: ${{ vars.NEVIX_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEVIX_SUPABASE_PUBLISHABLE_KEY }}
