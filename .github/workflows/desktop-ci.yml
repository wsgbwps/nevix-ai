name: Desktop CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      windows_native:
        description: Run the source Native Smoke suite on Windows.
        required: false
        default: false
        type: boolean
      macos_native:
        description: Run the source Native Smoke suite on macOS.
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit test
    runs-on: ubuntu-latest
    # Unbounded external downloads (Playwright CDN) have hung this job for
    # 25+ minutes in practice; cap it so a hang fails fast instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Cache the Playwright browser so `playwright install` is a no-op on hit;
      # a cold CDN download is the known hang point of this job.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop lint
      - run: pnpm --filter @nevix/desktop verify:architecture
      - run: pnpm --filter @nevix/desktop test:unit
      - run: pnpm --filter @nevix/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @nevix/desktop test:component

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop build

  windows-native:
    name: Native Smoke (Windows)
    needs: [quality, build]
    if: inputs.windows_native
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop test:native:smoke
      - name: Verify Native Smoke failure artifacts contain no credentials
        id: verify-windows-native-failure-artifacts
        if: failure()
        run: pnpm --filter @nevix/desktop verify:auth-artifacts
      - name: Upload Native Smoke failure artifacts
        if: failure() && steps.verify-windows-native-failure-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-source-windows-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  macos-native:
    name: Native Smoke (macOS)
    needs: [quality, build]
    if: inputs.macos_native
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop test:native:smoke
      - name: Verify Native Smoke failure artifacts contain no credentials
        id: verify-macos-native-failure-artifacts
        if: failure()
        run: pnpm --filter @nevix/desktop verify:auth-artifacts
      - name: Upload Native Smoke failure artifacts
        if: failure() && steps.verify-macos-native-failure-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-source-macos-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    needs: [quality, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop ${{ matrix.script }}
      - run: pnpm --filter @nevix/desktop test:native:packaged
      - name: Verify packaged Native Smoke failure artifacts contain no credentials
        id: verify-packaged-native-failure-artifacts
        if: failure()
        run: pnpm --filter @nevix/desktop verify:auth-artifacts
      - name: Upload packaged Native Smoke failure artifacts
        if: failure() && steps.verify-packaged-native-failure-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-packaged-${{ runner.os }}-test-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore
