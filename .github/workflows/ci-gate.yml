name: CI gate

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".pi/**"
      - ".codex/**"
      - ".agents/**"
      - ".omp/**"
      - ".scratch/**"
      - "docs/**"
      - "*.md"
      - "apps/desktop/AGENTS.md"
      - "server/AGENTS.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Validate, classify, and test harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dedup 查询 GitHub API:PR head、commit 树、green run 列表。
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      server: ${{ steps.classify.outputs.server }}
      identity: ${{ steps.classify.outputs.identity }}
      e2e: ${{ steps.classify.outputs.e2e }}
      skip_verified: ${{ steps.dedup.outputs.skip_verified }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            if [ -z "$base_sha" ] || echo "$base_sha" | grep -qE '^0+$'; then
              base_sha="$(git rev-parse HEAD^)"
            fi
            head_sha="$(git rev-parse HEAD)"
          fi

          node scripts/classify-ci-changes.mjs \
            --base "$base_sha" \
            --head "$head_sha" \
            --github-output "$GITHUB_OUTPUT"
      # 合并后 main push 的 tree-SHA 去重:squash 合并在 base 未移动时
      # 精确复现 PR head 的树;若该 head 已有 green gate run,则 PR 已
      # 验证过与本次 push 完全相同的内容,main 上重复的产品检查可以跳过。
      # 任何不确定情形(非 push、无 (#N)、base 已移动、无 green run、
      # API 失败)都 fail-open 到 false,照常全量跑。
      - name: Post-merge dedup (tree-SHA)
        id: dedup
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          node scripts/post-merge-dedup.mjs \
            --event "$EVENT_NAME" \
            --head-sha "$HEAD_SHA" \
            --repo "$REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.classify.outputs.harness == 'true'
        with:
          node-version: 22
      - name: Test delivery harness
        if: steps.classify.outputs.harness == 'true'
        run: make harness-test

  desktop:
    name: Desktop CI
    needs: changes
    # dedup 证明本次 push 的树已由 green PR run 验证过时,跳过重复检查。
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.skip_verified != 'true'
    uses: ./.github/workflows/desktop-ci.yml

  server:
    name: Server CI
    needs: changes
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.skip_verified != 'true'
    uses: ./.github/workflows/server-ci.yml

  identity:
    name: Identity Integration CI
    needs: changes
    if: needs.changes.outputs.identity == 'true' && needs.changes.outputs.skip_verified != 'true'
    uses: ./.github/workflows/mail-smoke-ci.yml

  e2e:
    name: Desktop E2E
    needs: changes
    # PR 只跑 smoke;需要全量时给 PR 打 full-e2e 标签主动升级
    # (workflow_dispatch 也可手动跑全量)。合并后的 main push 不再跑 E2E:
    # PR 已对同一棵代码树验证过,合并后重跑只产生重复成本。
    # skip-e2e 可跳过已分类的 smoke 运行;full-e2e 的升级请求优先,
    # 不被陈旧的 skip-e2e 标签静默吞掉。
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.labels.*.name, 'full-e2e') ||
        !contains(github.event.pull_request.labels.*.name, 'skip-e2e')
      )
    uses: ./.github/workflows/desktop-e2e-ci.yml
    with:
      suite: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') && 'full' || 'smoke' }}
  gate:
    name: CI gate
    if: always()
    needs: [changes, desktop, server, identity, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      SERVER_REQUIRED: ${{ needs.changes.outputs.server }}
      SERVER_RESULT: ${{ needs.server.result }}
      IDENTITY_REQUIRED: ${{ needs.changes.outputs.identity }}
      IDENTITY_RESULT: ${{ needs.identity.result }}
      E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
      # 合并后的 main push 按设计跳过 E2E（PR 已验证同一棵树），gate 只在
      # pull_request 事件上强制 E2E，否则 skipped 会被误判为失败。PR 打了
      # skip-e2e 时同样不强制;full-e2e 优先于 skip-e2e,升级请求仍被强制。
      E2E_ENFORCED: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'full-e2e') || !contains(github.event.pull_request.labels.*.name, 'skip-e2e')) }}
      E2E_RESULT: ${{ needs.e2e.result }}
      # tree-SHA 去重命中时,产品检查被有意跳过（green PR run 已验证同一
      # 棵树），gate 把这种 skipped 视为已满足。
      DEDUP_SKIP: ${{ needs.changes.outputs.skip_verified == 'true' }}
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          failed=false
          for check in DESKTOP SERVER IDENTITY E2E; do
            required_var="${check}_REQUIRED"
            result_var="${check}_RESULT"
            required="${!required_var}"
            result="${!result_var}"

            # Post-merge main pushes intentionally skip E2E (see the e2e job
            # condition); the gate enforces it only where it runs.
            if [ "$check" = "E2E" ] && [ "$E2E_ENFORCED" != "true" ]; then
              continue
            fi

            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              # Post-merge dedup intentionally skips checks whose tree a
              # green PR run already verified; treat that skip as satisfied.
              if [ "$DEDUP_SKIP" = "true" ] && [ "$result" = "skipped" ]; then
                continue
              fi
              echo "$check was required but finished as $result"
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            exit 1
          fi
