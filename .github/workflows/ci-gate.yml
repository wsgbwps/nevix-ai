name: CI gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Validate, classify, and test harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      server: ${{ steps.classify.outputs.server }}
      windows_native: ${{ steps.classify.outputs.windows_native }}
      macos_native: ${{ steps.classify.outputs.macos_native }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/classify-ci-changes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.classify.outputs.harness == 'true'
        with:
          node-version: 22
      - name: Test delivery harness
        if: steps.classify.outputs.harness == 'true'
        run: make harness-test

  desktop:
    name: Desktop CI
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-ci.yml
    with:
      windows_native: ${{ needs.changes.outputs.windows_native == 'true' }}
      macos_native: ${{ needs.changes.outputs.macos_native == 'true' }}

  server:
    name: Server CI
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server-ci.yml

  gate:
    name: CI gate
    if: always()
    needs: [changes, desktop, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      SERVER_REQUIRED: ${{ needs.changes.outputs.server }}
      SERVER_RESULT: ${{ needs.server.result }}
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          failed=false
          for check in DESKTOP SERVER; do
            required_var="${check}_REQUIRED"
            result_var="${check}_RESULT"
            required="${!required_var}"
            result="${!result_var}"

            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "$check was required but finished as $result"
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            exit 1
          fi
