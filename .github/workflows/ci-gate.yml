name: CI gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Validate, classify, and test harness
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      server: ${{ steps.classify.outputs.server }}
      identity: ${{ steps.classify.outputs.identity }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            if [ -z "$base_sha" ] || echo "$base_sha" | grep -qE '^0+$'; then
              base_sha="$(git rev-parse HEAD^)"
            fi
            head_sha="$(git rev-parse HEAD)"
          fi

          node scripts/classify-ci-changes.mjs \
            --base "$base_sha" \
            --head "$head_sha" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.classify.outputs.harness == 'true'
        with:
          node-version: 22
      - name: Test delivery harness
        if: steps.classify.outputs.harness == 'true'
        run: make harness-test

  desktop:
    name: Desktop CI
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-ci.yml

  server:
    name: Server CI
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server-ci.yml

  identity:
    name: Identity Integration CI
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    uses: ./.github/workflows/mail-smoke-ci.yml

  e2e:
    name: Desktop E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/desktop-e2e-ci.yml
    with:
      suite: ${{ github.event_name == 'push' && 'full' || 'smoke' }}

  gate:
    name: CI gate
    if: always()
    needs: [changes, desktop, server, identity, e2e]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      SERVER_REQUIRED: ${{ needs.changes.outputs.server }}
      SERVER_RESULT: ${{ needs.server.result }}
      IDENTITY_REQUIRED: ${{ needs.changes.outputs.identity }}
      IDENTITY_RESULT: ${{ needs.identity.result }}
      E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change validation did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          failed=false
          for check in DESKTOP SERVER IDENTITY E2E; do
            required_var="${check}_REQUIRED"
            result_var="${check}_RESULT"
            required="${!required_var}"
            result="${!result_var}"

            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "$check was required but finished as $result"
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            exit 1
          fi
