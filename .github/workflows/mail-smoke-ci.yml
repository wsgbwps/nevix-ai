name: Identity Integration CI

on:
  workflow_call:

concurrency:
  group: identity-integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-integration:
    name: Supabase stack + Identity integration
    # Pinned runner image so an unannounced runner switch cannot change the stack.
    runs-on: ubuntu-24.04
    # Starts a full Supabase stack; median ~5 min, allow generous headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/supabase-image-cache
        id: supabase-images
        with:
          phase: restore
      - run: bash scripts/tests/supabase-local-harness.test.sh
      - run: ./scripts/test-identity-integration.sh
      - uses: ./.github/actions/supabase-image-cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        with:
          phase: save
      # Backstop for the script's own EXIT trap: if the runner kills the script,
      # the trap never fires, so tear the stack down here as well.
      - name: Tear down Supabase stack
        if: always()
        run: pnpm exec supabase stop --project-id nevix-ai --no-backup || true
