name: Stable release build and signing for vendor review

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: nevix-stable-publication
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          node -e 'const fs=require("node:fs"); fs.writeFileSync("identity.json",JSON.stringify({version:process.env.VERSION}),{mode:0o600})'
          node --experimental-strip-types deploy/publish-stable.mjs identity identity.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: node --experimental-strip-types --test deploy/publish-stable.test.mjs

  harness:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make harness-test

  desktop-checks:
    needs: identity
    uses: ./.github/workflows/desktop-ci.yml
    with:
      windows_native: true
      macos_native: true

  server-checks:
    needs: identity
    uses: ./.github/workflows/server-ci.yml

  windows:
    needs: [identity, harness, desktop-checks, server-checks]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop build
      - run: pnpm --filter @nevix/desktop exec electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: stable-windows
          path: apps/desktop/dist/Nevix-AI-${{ needs.identity.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    needs: [identity, harness, desktop-checks, server-checks]
    # Dedicated vendor Apple Silicon runner must be provisioned before an approved stable tag.
    # No ephemeral identity or automatic keychain/system setup.
    runs-on: [self-hosted, macOS, ARM64, nevix-release]
    timeout-minutes: 30
    env:
      NEVIX_MAC_SIGNING_SHA1: ${{ vars.NEVIX_MAC_SIGNING_SHA1 }}
      NEVIX_MAC_SIGNING_KEYCHAIN: ${{ vars.NEVIX_MAC_SIGNING_KEYCHAIN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nevix/desktop build:mac:release
      - name: Collect the exact signed DMG and ZIP
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir artifacts
          cp "apps/desktop/dist/Nevix-AI-$VERSION.dmg" "artifacts/Nevix-AI-$VERSION.dmg"
          node -e 'const fs=require("node:fs"); const files=fs.readdirSync("apps/desktop/dist").filter(x=>x.endsWith(".zip")); if(files.length!==1) throw Error("Expected one arm64 ZIP"); fs.copyFileSync("apps/desktop/dist/"+files[0],"artifacts/Nevix-AI-"+process.env.VERSION+"-arm64.zip")'
      - uses: actions/upload-artifact@v4
        with:
          name: stable-mac
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  server:
    needs: [identity, harness, desktop-checks, server-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Use OCI image store for vendor export
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/docker.tgz" https://download.docker.com/linux/static/stable/x86_64/docker-29.4.0.tgz
          tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP"
          sudo systemctl stop docker.socket docker containerd
          sudo install -m 0755 "$RUNNER_TEMP"/docker/* /usr/bin/
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start containerd docker
          test "$(docker version --format '{{.Server.Version}}')" = 29.4.0
          docker version
          docker compose version
      - env:
          VERSION: ${{ needs.identity.outputs.version }}
          MIN_DESKTOP_VERSION: ${{ vars.NEVIX_MIN_DESKTOP_VERSION }}
          MIN_SERVER_VERSION: ${{ vars.NEVIX_MIN_SERVER_VERSION }}
        run: |
          set -euo pipefail
          mkdir artifacts
          bash deploy/scripts/build-bundle.sh "$VERSION" "$MIN_DESKTOP_VERSION" "$MIN_SERVER_VERSION" "artifacts/Nevix-server-$VERSION-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-server
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    needs:
      [identity, harness, desktop-checks, server-checks, windows, mac, server]
    # Provisioning this dedicated vendor runner and key is a pending prerequisite.
    # The owner approves the exact source tag before triggering this signing action.
    runs-on: [self-hosted, macOS, ARM64, nevix-release]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          path: artifacts
          merge-multiple: true
      - name: Sign exact four artifacts with the preprovisioned vendor encrypted key
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          MIN_DESKTOP_VERSION: ${{ vars.NEVIX_MIN_DESKTOP_VERSION }}
          MIN_SERVER_VERSION: ${{ vars.NEVIX_MIN_SERVER_VERSION }}
          NEVIX_RELEASE_PRIVATE_KEY_FILE: ${{ vars.NEVIX_RELEASE_PRIVATE_KEY_FILE }}
          NEVIX_RELEASE_KEY_PASSPHRASE: ${{ secrets.NEVIX_RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f signing-input.json' EXIT
          node --input-type=module -e '
            import fs from "node:fs";
            const v=process.env.VERSION;
            const artifacts={"win32-x64":`artifacts/Nevix-AI-${v}-setup.exe`,"darwin-arm64":`artifacts/Nevix-AI-${v}-arm64.zip`,"darwin-arm64-dmg":`artifacts/Nevix-AI-${v}.dmg`,"linux-amd64":`artifacts/Nevix-server-${v}-linux-amd64.tar.gz`};
            fs.writeFileSync("signing-input.json",JSON.stringify({version:v,min_server_version:process.env.MIN_SERVER_VERSION,min_desktop_version:process.env.MIN_DESKTOP_VERSION,artifacts,private_key_file:process.env.NEVIX_RELEASE_PRIVATE_KEY_FILE,output_directory:"signed"}),{mode:0o600});'
          node --experimental-strip-types deploy/publish-stable.mjs prepare signing-input.json
      - uses: actions/upload-artifact@v4
        with:
          name: stable-signed
          path: signed/*
          if-no-files-found: error
          retention-days: 7
